name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels the run still going for the previous one. Pushes to main each get their
# own group, so they never cancel each other.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # On a PR, only the side that changed runs. Pushes to main run everything. There are no required
  # checks, so a skipped job never holds up a merge.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/**'
              - 'tests/**'
              - 'locales/**'
              - 'Directory.Build.props'
              - 'Maki.sln'
              - 'scripts/ci/**'
              - 'distribution/libjxl/**'
              - '.github/actions/libjxl/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'locales/**'
              - 'scripts/frontend/**'
              - 'scripts/i18n/**'
              - '.github/workflows/ci.yml'

  # The whole solution in Release, so a project no test references still has to compile, plus every
  # test project except Maki.Api.Tests, which the api-tests shards below run.
  backend:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    # A stalled step (registry outage, hung native install) would otherwise ride to GitHub's
    # 6-hour job cap before it gets cancelled, so fail fast instead. 30 rather than 20 for the run that
    # builds libjxl after build.sh changes; later runs take it from the cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      # Warnings fail the build. NuGet vulnerability advisories stay warnings: one is published against a
      # package, not against the PR, and would otherwise fail every backend PR on the same day.
      - run: dotnet build --no-restore -c Release -warnaserror -warnnotaserror:NU1901,NU1902,NU1903,NU1904

      # The JPEG XL tests skip without libjxl, so CI provides it (cached on the build script, which pins
      # the version) and sets MAKI_REQUIRE_LIBJXL so a missing or broken library fails them instead.
      # libjxl-cache.yml keeps a copy on dev for new PRs. Only this job saves; a shard builds on a miss.
      - uses: ./.github/actions/libjxl
        with:
          save: 'true'
      - name: Put libjxl beside the test assemblies
        run: for dir in tests/*/bin/Release/net10.0; do cp .artifacts/libjxl/* "$dir/"; done

      - run: dotnet test --no-build -c Release --filter 'FullyQualifiedName!~Maki.Api.Tests.'
        env:
          MAKI_REQUIRE_LIBJXL: '1'

  # Maki.Api.Tests is most of the backend's test time, and the classes that boot a host run one at a
  # time inside a process (ConfigDirCollection). Four processes on four runners split both.
  api-tests:
    name: api-tests (${{ matrix.shard }}/4)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tests/Maki.Api.Tests -c Release
      - uses: ./.github/actions/libjxl
      - name: Put libjxl beside the test assembly
        run: cp .artifacts/libjxl/* tests/Maki.Api.Tests/bin/Release/net10.0/
      - run: bash scripts/ci/test-shard.sh tests/Maki.Api.Tests ${{ matrix.shard }} 4
        env:
          MAKI_REQUIRE_LIBJXL: '1'

  frontend:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      # Errors fail the job. Warnings (exhaustive-deps, only-export-components) are only reported.
      - name: Lint
        run: npm run lint

      - run: npm run build

      # Self-hosters open the app over plain HTTP on a LAN address, where crypto.randomUUID and
      # navigator.clipboard are undefined. It works on localhost, so it only surfaces after release.
      - name: No secure-context-only APIs outside their helpers
        run: npm run check:secure-context

      # Catches a new t/<Trans> whose English was never extracted, and a key hand-added to
      # en/server.po but never propagated. Either way the string compiles and renders in English
      # while being absent from thirteen catalogues, with nothing to say so. Diffing the whole tree
      # rather than just English also catches committing the source change without the locale files.
      - name: Catalogues are up to date
        run: |
          npx lingui extract --clean
          npm run i18n:check
          git diff --exit-code ../locales

      # Structural check on the translations themselves: placeholder sets, ICU syntax, and above all
      # whether each plural covers the categories its language actually requires.
      - name: Translations are structurally sound
        run: npm run i18n:validate

      # English is bundled eagerly as the fallback; the other thirteen are dynamic imports. One
      # static import of any of them undoes that with no error to notice: the build succeeds, the
      # app works, and the bundle carries a megabyte of Korean nobody fetched. Reads the built
      # index.html, so it needs the build step above.
      - name: Only English is in the eager bundle
        run: npm run i18n:bundle

  # Every story renders under the app's real providers against the MSW mocks in .storybook/mocks,
  # and a story whose component calls an endpoint nothing mocks fails, so a new API call has to
  # bring its mock along.
  # Sharded across runners: a single run of every story passed about six minutes on the runner, after
  # which msw's service worker stopped answering in every page at once and the rest of the run timed
  # out story by story.
  storybook:
    name: storybook (${{ matrix.shard }}/3)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci

      # Chromium only; the browser binary is not in the npm cache. No --with-deps: ubuntu-latest already
      # carries every library Chromium links against, and what that flag adds is 26 MB of optional CJK
      # and fallback fonts from the runner's apt mirror, which has run slow enough to time the job out.
      - name: Install Chromium for Storybook
        timeout-minutes: 4
        run: npx playwright install chromium

      - name: Storybook stories render and pass their play functions
        # A story that wedges its page never times out inside the browser; fail here, not at the job cap.
        timeout-minutes: 8
        run: npm run test-storybook -- --shard=${{ matrix.shard }}/3

  # Release notes are collected in changes/ as work lands (changes/README.md). A PR that touches the
  # app without an entry is usually fine (refactor, fix to unreleased work), so this warns, never fails.
  release-notes-entry:
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: PR has a changes/ entry if it touches the app
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          if echo "$files" | grep -qE '^(src/|frontend/src/)' \
            && ! echo "$files" | grep -E '^changes/.+\.md$' | grep -qv '^changes/README\.md$'; then
            echo "::warning title=No release notes entry::This PR changes src/ or frontend/src/ but adds nothing under changes/. Add one if a user of the last release would notice (see changes/README.md)."
          fi
