name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # A stalled step (registry outage, hung native install) would otherwise ride to GitHub's
    # 6-hour job cap before it gets cancelled — fail fast instead.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

      # Chromium only; the browser binary is not in the npm cache. No --with-deps: ubuntu-latest already
      # carries every library Chromium links against, and what that flag adds is 26 MB of optional CJK
      # and fallback fonts from the runner's apt mirror, which has run slow enough to time the job out.
      - name: Install Chromium for Storybook
        timeout-minutes: 4
        run: npx playwright install chromium

      # Every story renders under the app's real providers against the MSW mocks in .storybook/mocks,
      # and a story whose component calls an endpoint nothing mocks fails, so a new API call has to
      # bring its mock along.
      # Two shards, each in its own browsers: a single run of every story passed about six minutes on
      # the runner, after which msw's service worker stopped answering in every page at once and the
      # rest of the run timed out story by story.
      - name: Storybook stories render and pass their play functions (1/2)
        # A story that wedges its page never times out inside the browser; fail here, not at the job cap.
        timeout-minutes: 8
        run: npm run test-storybook -- --shard=1/2
      - name: Storybook stories render and pass their play functions (2/2)
        if: success() || failure()
        timeout-minutes: 8
        run: npm run test-storybook -- --shard=2/2

      # Self-hosters open the app over plain HTTP on a LAN address, where crypto.randomUUID and
      # navigator.clipboard are undefined. It works on localhost, so it only surfaces after release.
      - name: No secure-context-only APIs outside their helpers
        run: npm run check:secure-context

      # Catches a new t/<Trans> whose English was never extracted, and a key hand-added to
      # en/server.po but never propagated. Either way the string compiles and renders in English
      # while being absent from thirteen catalogues, with nothing to say so. Diffing the whole tree
      # rather than just English also catches committing the source change without the locale files.
      - name: Catalogues are up to date
        run: |
          npx lingui extract --clean
          npm run i18n:check
          git diff --exit-code ../locales

      # Structural check on the translations themselves: placeholder sets, ICU syntax, and above all
      # whether each plural covers the categories its language actually requires.
      - name: Translations are structurally sound
        run: npm run i18n:validate

      # English is bundled eagerly as the fallback; the other thirteen are dynamic imports. One
      # static import of any of them undoes that with no error to notice: the build succeeds, the
      # app works, and the bundle carries a megabyte of Korean nobody fetched. Reads the built
      # index.html, so it needs the build step above.
      - name: Only English is in the eager bundle
        run: npm run i18n:bundle

  # Release notes are collected in changes/ as work lands (changes/README.md). A PR that touches the
  # app without an entry is usually fine (refactor, fix to unreleased work), so this warns, never fails.
  release-notes-entry:
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: PR has a changes/ entry if it touches the app
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          if echo "$files" | grep -qE '^(src/|frontend/src/)' \
            && ! echo "$files" | grep -E '^changes/.+\.md$' | grep -qv '^changes/README\.md$'; then
            echo "::warning title=No release notes entry::This PR changes src/ or frontend/src/ but adds nothing under changes/. Add one if a user of the last release would notice (see changes/README.md)."
          fi
