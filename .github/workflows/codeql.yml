name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
    paths-ignore:
      - '**/*.md'
      - 'changes/**'
      - 'locales/**'
      - 'docs/**'
  # Weekly on main, so the queries a new CodeQL release adds also run over code that has not changed.
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # build-mode none: C# is analysed from source with NuGet dependencies resolved, so this never needs
  # the frontend build or libjxl that a real build of Maki.Api pulls in.
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v5

      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Tests build hostile inputs on purpose, and msw's worker is vendored.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - tests
              - frontend/public/mockServiceWorker.js

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
