name: Docker

on:
  # Tags only. A push to main is not a release, and the version below is derived from a tag — a
  # branch push has none, so it could only build something unversioned. Multi-arch buildx (arm64
  # under qemu) is also slow enough that it has no business running on ordinary commits.
  push:
    tags:
      - 'v*'
  # Escape hatch for rebuilding an existing tag (a transient registry failure, a base image rebuilt
  # under the same digest).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.29.0
        required: true
        type: string

concurrency:
  group: production-container
  cancel-in-progress: false

jobs:
  # ci.yml runs on branch pushes and pull requests, so a tag push reaches the publish job below
  # with nothing having checked the catalogues. The image embeds them — locales/*/server.po as
  # resources in Maki.Api, locales/*/client.po bundled by Vite — so a catalogue that is stale or
  # structurally broken at tag time ships to every user as silent English or a literal {count}.
  # This is the same set of gates ci.yml runs, minus the built-bundle one, which needs a full
  # frontend build and is not worth the minutes here. It is about the catalogues being in step
  # with the source; whether they reached the image is asserted inside the Dockerfile itself, so
  # that half covers a local build-release.ps1 run too.
  catalogues:
    name: Catalogues are in step
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Extraction and server keys are committed
        run: |
          npx lingui extract --clean
          npm run i18n:check
          git diff --exit-code ../locales

      - name: Translations are structurally sound
        run: npm run i18n:validate

  publish:
    name: Build and publish image
    needs: catalogues
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            echo "::error::A release tag is required when this workflow is run manually."
            exit 1
          fi

          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag must look like vX.Y.Z or vX.Y.Z-<prerelease>: $tag"
            exit 1
          fi

          version="${tag#v}"
          source_commit="$(git rev-parse HEAD)"
          if printf '%s' "$version" | grep -q -- '-'; then
            stable=false
          else
            stable=true
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "stable=$stable" >> "$GITHUB_OUTPUT"
          echo "Building $tag at $source_commit"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/orbitmpgh/maki
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable }}

      - name: Build and publish multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: distribution/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.release.outputs.version }}
            SOURCE_COMMIT=${{ steps.release.outputs.source_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
