name: Native builds

on:
  # A published release, not a tag push: release.ps1 pushes the tag first and creates the release
  # several confirmations later, and these jobs upload into the release, so it has to exist. A
  # release created with the owner's own gh credentials triggers this; one created by a workflow's
  # GITHUB_TOKEN would not.
  release:
    types: [published]
  # Rebuild an existing release, or try the pipeline without one (upload: false).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.35.0
        required: true
        type: string
      upload:
        description: Upload the packages to that release
        required: true
        type: boolean
        default: false

concurrency:
  group: native-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Resolve version
        id: release
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag must look like vX.Y.Z or vX.Y.Z-<prerelease>: $TAG"
            exit 1
          fi
          version="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if printf '%s' "$version" | grep -q -- '-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3

  windows:
    name: Windows x64
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.frontend.outputs.tag }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # The tray app follows stable releases only, so a release candidate is built and smoke-tested
      # but never joins the update feed: packing it would hand every installed copy an -rc.
      - name: Build, self-test and pack
        shell: pwsh
        env:
          PACK: ${{ needs.frontend.outputs.prerelease == 'false' }}
        run: |
          $pack = $env:PACK -eq 'true'
          ./distribution/native/build-windows.ps1 -Version '${{ needs.frontend.outputs.version }}' `
            -FrontendDist frontend-dist -Pack:$pack -PreviousReleases:$pack

      - name: Name the downloads
        shell: pwsh
        run: |
          $version = '${{ needs.frontend.outputs.version }}'
          $out = 'out/native/win-x64'
          $upload = New-Item -ItemType Directory -Force "$out/upload"
          if (Test-Path "$out/releases/Maki.Desktop-win-Setup.exe") {
            Copy-Item "$out/releases/Maki.Desktop-win-Setup.exe" "$upload/Maki-$version-windows-x64-setup.exe"
            Copy-Item "$out/releases/Maki.Desktop-win-Portable.zip" "$upload/Maki-$version-windows-x64-portable.zip"
            # The feed and packages keep Velopack's own names: GithubSource looks for exactly these.
            Get-ChildItem "$out/releases" -File |
              Where-Object { $_.Name -like 'releases.win.json' -or $_.Name -like 'assets.win.json' -or $_.Name -like 'RELEASES*' -or ($_.Name -like '*.nupkg' -and $_.Name -like "*$version*") } |
              Copy-Item -Destination $upload
          } else {
            Compress-Archive -Path "$out/app/*" -DestinationPath "$upload/Maki-$version-windows-x64-portable.zip"
          }
          Get-ChildItem $upload | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/native/win-x64/upload
          retention-days: 7

      - name: Upload to the release
        if: github.event_name == 'release' || inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload '${{ needs.frontend.outputs.tag }}' (Get-ChildItem out/native/win-x64/upload).FullName --clobber

  linux:
    name: Linux ${{ matrix.arch }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          # GitHub's hosted arm64 runners are free for public repositories. They are what lets the
          # arm64 tarball ship with a self-test behind it without anyone owning an ARM box.
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.frontend.outputs.tag }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Build and self-test
        run: bash distribution/native/build-linux.sh '${{ needs.frontend.outputs.version }}' frontend-dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/native/linux-${{ matrix.arch }}/*.tar.gz
          retention-days: 7

      - name: Upload to the release
        if: github.event_name == 'release' || inputs.upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload '${{ needs.frontend.outputs.tag }}' out/native/linux-${{ matrix.arch }}/*.tar.gz --clobber
