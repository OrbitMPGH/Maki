<!-- @dsCard group="Status" height=72 subtitle="Static rendition of Mantine Badge with Maki defaults" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Badge preview</title></head>
<body>
<div class="mk-preview" style="align-items:center">
  <span class="mk-badge" style="--tone:var(--info);--tone-soft:var(--info-soft)">Ongoing</span>
  <span class="mk-badge" style="--tone:var(--ok);--tone-soft:var(--ok-soft)">Completed</span>
  <span class="mk-badge" style="--tone:var(--warn);--tone-soft:var(--warn-soft)">Hiatus</span>
  <span class="mk-badge" style="--tone:var(--danger);--tone-soft:var(--danger-soft)">Cancelled</span>
  <span class="mk-badge" style="--tone:var(--watched);--tone-soft:var(--watched-soft)">Read</span>
  <span class="mk-badge" style="--tone:var(--suggestive);--tone-soft:var(--suggestive-soft)">Suggestive</span>
  <span class="mk-badge">New</span>
</div>
</body>
</html>
