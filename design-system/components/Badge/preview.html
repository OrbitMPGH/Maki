<!-- @dsCard group="Status" height=112 subtitle="Light badge colours" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Badge preview</title></head>
<body>
<div class="mk-preview" style="align-items:center">
  <span class="mk-badge" style="--tone:var(--info)">Ongoing</span>
  <span class="mk-badge" style="--tone:var(--ok)">Completed</span>
  <span class="mk-badge" style="--tone:var(--warn)">Hiatus</span>
  <span class="mk-badge" style="--tone:var(--danger);--tone-fg:var(--danger-fg)">Cancelled</span>
  <span class="mk-badge" style="--tone:var(--anime)">Watched</span>
  <span class="mk-badge" style="--tone:var(--volume)">Vol. 3</span>
  <span class="mk-badge" style="--tone:var(--cr-suggestive)">Suggestive</span>
  <span class="mk-badge" style="--tone:var(--q-official)">Official</span>
  <span class="mk-badge">New</span>
</div>
</body>
</html>
