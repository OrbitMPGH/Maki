<!-- @dsCard group="Actions" height=120 subtitle="Static rendition of Mantine Button with Maki defaults" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button preview</title></head>
<body>
<div class="mk-preview" style="align-items:center">
  <button class="mk-button"><svg data-icon="IconPlus" data-size="16" class="mk-icon"></svg> Add series</button>
  <button class="mk-button" data-variant="light"><svg data-icon="IconRefresh" data-size="16" class="mk-icon"></svg> Refresh</button>
  <button class="mk-button" data-variant="default">Cancel</button>
  <button class="mk-button" data-variant="subtle">Find more <svg data-icon="IconChevronRight" data-size="16" class="mk-icon"></svg></button>
  <button class="mk-button" data-variant="default" data-size="xs"><svg data-icon="IconDownload" data-size="16" class="mk-icon"></svg> Search</button>
</div>
</body>
</html>
