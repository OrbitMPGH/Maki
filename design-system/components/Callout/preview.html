<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Callout preview</title></head>
<body>
<div class="mk-preview" data-stack style="gap:10px">
  <div class="callout" data-tone="warn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon callout-icon" aria-hidden="true"><path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0z"/><path d="M12 16h.01"/></svg>
    <div class="callout-body"><div class="callout-title">Library folder is offline</div>Downloads wait until it is back.</div>
    <div class="callout-actions"><button class="mk-button" data-variant="default" data-size="xs">Check again</button></div>
  </div>
  <div class="callout" data-tone="info">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon callout-icon" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M12 9h.01"/><path d="M11 12h1v4h1"/></svg>
    <div class="callout-body">A metadata refresh is running. Covers may change.</div>
  </div>
  <div class="callout" data-tone="danger">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon callout-icon" aria-hidden="true"><path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0z"/><path d="M12 16h.01"/></svg>
    <div class="callout-body">The last backup failed.</div>
  </div>
  <div class="callout" data-tone="ok">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon callout-icon" aria-hidden="true"><path d="M5 12l5 5l10 -10"/></svg>
    <div class="callout-body">Everything is up to date.</div>
  </div>
  <div class="callout" data-tone="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon callout-icon" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M12 9h.01"/><path d="M11 12h1v4h1"/></svg>
    <div class="callout-body">Pick a start page in Settings.</div>
  </div>
</div>
</body>
</html>
