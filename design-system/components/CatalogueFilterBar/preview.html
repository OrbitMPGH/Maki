<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CatalogueFilterBar preview</title></head>
<body>
<div class="mk-preview" data-stack>
  <div class="filter-bar">
    <div class="filter-bar-row" role="toolbar" aria-label="Filters">
      <button type="button" class="filter-bar-button" data-active>
        <svg data-icon="IconTag" class="filter-bar-button-icon"></svg>
        <span class="filter-bar-button-value">Fantasy</span>
        <svg data-icon="IconChevronDown" data-size="12" class="filter-bar-button-chevron"></svg>
      </button>
      <span class="filter-bar-divider" aria-hidden="true"></span>
      <button type="button" class="filter-bar-button">
        <svg data-icon="IconCalendar" class="filter-bar-button-icon"></svg> Year
        <svg data-icon="IconChevronDown" data-size="12" class="filter-bar-button-chevron"></svg>
      </button>
      <button type="button" class="filter-bar-button filter-bar-add"><svg data-icon="IconPlus"></svg> Add filter</button>
    </div>
    <div class="filter-bar-end">
      <span class="tnum">186 results</span>
      <button type="button" class="mk-button" data-size="xs" data-variant="subtle">Reset</button>
      <button type="button" class="filter-bar-menu" aria-label="More filter actions"><svg data-icon="IconDots" data-size="18"></svg></button>
    </div>
  </div>
</div>
</body>
</html>
