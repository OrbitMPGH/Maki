<!-- @dsCard group="Feedback" height=250 subtitle="Static rendition of the Mantine Modal it wraps" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ConfirmDialog preview</title></head>
<body>
<div class="mk-overlay">
  <div class="utility-modal-content" role="dialog" aria-label="Delete profile">
    <div class="utility-modal-header">
      <h2 class="utility-modal-title">Delete Night reading?</h2>
      <button class="utility-modal-close" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon" aria-hidden="true" > <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M18 6l-12 12" /> <path d="M6 6l12 12" /> </svg></button>
    </div>
    <div class="utility-modal-body">
      <p>The profile and its reader settings are removed. This can't be undone.</p>
      <div class="mk-actions">
        <button class="mk-button" data-variant="default">Cancel</button>
        <button class="mk-button" data-color="danger">Delete profile</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
