<!-- @dsCard group="Status" height=72 subtitle="Static rendition of Mantine Indicator with Maki defaults" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CountIndicator preview</title></head>
<body>
<div class="mk-preview" style="align-items:center;gap:20px">
  <span class="mk-count-host">
    <svg data-icon="IconDownload" data-size="16"></svg>
    <span class="mk-count">2</span>
  </span>
  <span class="mk-count-host">
    <svg data-icon="IconBell" data-size="16"></svg>
    <span class="mk-count">12</span>
  </span>
  <span class="mk-count-host">
    <svg data-icon="IconDownload" data-size="16"></svg>
    <span class="mk-count" data-tone="warn">1</span>
  </span>
  <span class="mk-count-host">
    <svg data-icon="IconBell" data-size="16"></svg>
    <span class="mk-count">99+</span>
  </span>
</div>
</body>
</html>
