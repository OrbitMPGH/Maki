<!-- @dsCard group="Library" height=306 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CoverCard preview</title></head>
<body>
<div class="mk-preview cover-preview">
  <div class="reading-card library-card">
    <a class="cover-card" href="#" style="--series-accent:var(--teal-7)">
      <div class="cover-poster" style="background:linear-gradient(160deg,var(--teal-5),var(--dark-8))">
        <div class="cover-scrim"></div>
        <div class="cover-meta">
          <span class="cover-title">Frieren: Beyond Journey's End</span>
          <div class="cover-row"><span>98<span class="cover-count-total">/136</span></span><span class="cover-new">4 new</span></div>
          <div class="cover-bar-hit"><div class="cover-bar"><div class="cover-bar-fill" style="width:72%"></div></div></div>
        </div>
        <div class="cover-corners">
          <div class="cover-corner cover-corner-left">
            <span class="cover-state" data-tone="info" role="img" aria-label="Downloading"><svg data-icon="IconDownload" data-size="13"></svg></span>
          </div>
          <div class="cover-corner cover-corner-right">
            <span class="cover-state" data-tone="status" data-read="part" style="--tone:var(--info);--tone-on:var(--info-on);--ring-pct:60%" role="img" aria-label="Ongoing. 59 of 98 downloaded read"><svg data-icon="IconPlayerPlay" data-size="13"></svg></span>
          </div>
        </div>
      </div>
    </a>
    <button class="reading-card-menu cover-card-menu" type="button" aria-label="More options for Frieren"><svg data-icon="IconDots"></svg></button>
  </div>

  <a class="cover-card" href="#" role="checkbox" aria-checked="true" data-selected="true" style="--series-accent:var(--amber-8)">
    <div class="cover-poster" style="background:linear-gradient(160deg,var(--amber-5),var(--dark-8))">
      <div class="cover-scrim"></div>
      <span class="cover-check" data-checked aria-hidden="true"></span>
      <div class="cover-meta">
        <span class="cover-title">Dungeon Meshi</span>
        <div class="cover-row"><span>97 of 97</span></div>
        <div class="cover-bar-hit">
          <div class="cover-bar" data-reading>
            <div class="cover-bar-fill" data-complete style="width:100%"></div>
            <div class="cover-bar-read" style="width:70%"></div>
          </div>
        </div>
      </div>
      <div class="cover-corners">
        <div class="cover-corner cover-corner-right">
          <span class="cover-state" data-tone="status" style="--tone:var(--ok);--tone-on:var(--ok-on)" role="img" aria-label="Completed"><svg data-icon="IconCheck" data-size="13"></svg></span>
        </div>
      </div>
    </div>
  </a>

  <a class="cover-card" href="#">
    <div class="cover-poster">
      <div class="cover-placeholder" aria-hidden="true">An unlisted series</div>
      <div class="cover-scrim"></div>
      <div class="cover-meta">
        <span class="cover-title">An unlisted series</span>
        <div class="cover-row"><span>No chapters</span></div>
        <div class="cover-bar-hit"><div class="cover-bar" data-empty></div></div>
      </div>
      <div class="cover-corners">
        <div class="cover-corner cover-corner-right">
          <span class="cover-badge cover-badge-circle" role="img" aria-label="Not monitored"><svg data-icon="IconEyeOff"></svg></span>
          <span class="cover-state" data-tone="status" data-unmonitored style="--tone:var(--warn);--tone-on:var(--warn-on)" role="img" aria-label="Hiatus, not monitored"><svg data-icon="IconPlayerPause" data-size="13"></svg></span>
        </div>
      </div>
    </div>
  </a>
</div>
</body>
</html>
