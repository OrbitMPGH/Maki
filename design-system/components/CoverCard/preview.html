<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CoverCard preview</title></head>
<body>
<div class="mk-preview" style="gap:16px">
  <a class="cover-card" href="#">
    <div class="cover-poster" style="background:linear-gradient(160deg, var(--indigo-7), var(--dark-8))">
      <div class="cover-placeholder" style="align-items:start;padding-top:40%;color:var(--indigo-2)">Cover art</div>
      <div class="cover-scrim"></div>
      <div class="cover-corners">
        <div class="cover-corner">
          <span class="cover-badge" style="background:var(--info)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon" aria-hidden="true" > <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" /> <path d="M7 11l5 5l5 -5" /> <path d="M12 4l0 12" /> </svg><span>2 queued</span></span>
          <span class="cover-badge cover-badge-unread">4</span>
        </div>
        <div class="cover-corner cover-corner-right">
          <span class="cover-badge cover-badge-circle" data-dim><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon" aria-hidden="true" > <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /> <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" /> </svg></span>
        </div>
      </div>
      <div class="cover-meta">
        <span class="cover-title">Frieren: Beyond Journey's End</span>
        <div class="cover-progress-row"><div class="cover-bar"><div class="cover-bar-fill" style="width:72%"></div></div><span class="cover-count tnum">98/136</span></div>
      </div>
    </div>
  </a>
  <a class="cover-card" href="#" data-selected="true">
    <div class="cover-poster" style="background:linear-gradient(160deg, var(--emerald-8), var(--dark-8))">
      <div class="cover-placeholder" style="align-items:start;padding-top:40%;color:var(--emerald-2)">Cover art</div>
      <div class="cover-scrim"></div>
      <div class="cover-corners">
        <div class="cover-corner"><span class="cover-ring" data-complete style="--ring-pct:100%"></span></div>
        <div class="cover-corner cover-corner-right">
          <span class="cover-badge" style="background:var(--ok)"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon" aria-hidden="true" > <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M5 12l5 5l10 -10" /> </svg><span>Completed</span></span>
        </div>
      </div>
      <div class="cover-meta">
        <span class="cover-title">Yotsuba&amp;!</span>
        <div class="cover-progress-row"><div class="cover-bar"><div class="cover-bar-fill" data-complete style="width:100%"></div></div><span class="cover-count tnum">112/112</span></div>
      </div>
    </div>
  </a>
</div>
</body>
</html>
