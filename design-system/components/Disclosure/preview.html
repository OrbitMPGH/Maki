<!-- @dsCard group="Layout" height=230 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Disclosure preview</title></head>
<body>
<div class="mk-preview" style="display:block;max-width:360px">
  <div class="disclosure" data-open>
    <button type="button" class="disclosure-head" aria-expanded="true">
      <span class="disclosure-text"><span class="disclosure-line"><span class="disclosure-title">Series</span></span></span>
      <svg class="disclosure-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"/></svg>
    </button>
    <div class="disclosure-body"><span style="color:var(--ink-3);font-size:var(--type-meta)">Status, type, content rating, chapters</span></div>
  </div>
  <div class="disclosure">
    <button type="button" class="disclosure-head" aria-expanded="false">
      <span class="disclosure-text"><span class="disclosure-line"><span class="disclosure-title">Ratings and reading</span><span class="disclosure-count tnum">2</span></span></span>
      <svg class="disclosure-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"/></svg>
    </button>
  </div>
  <div class="disclosure">
    <button type="button" class="disclosure-head" aria-expanded="false">
      <span class="disclosure-text"><span class="disclosure-line"><span class="disclosure-title">Thresholds</span></span><span class="disclosure-summary">Disk warning below 10% or 10 GiB, error below 2% or 1 GiB. Backups count as stale after 7 days.</span></span>
      <svg class="disclosure-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6l6 -6"/></svg>
    </button>
  </div>
</div>
</body>
</html>
