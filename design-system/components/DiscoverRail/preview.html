<!-- @dsCard group="Library" height=330 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DiscoverRail preview</title></head>
<body>
<div class="mk-preview discover-density" data-stack>
  <div class="discover-rail" data-fade-end style="--rail-right:160px">

    <div class="discover-rail-item">
      <div class="cover-card discover-card">
        <button type="button" class="discover-card-action" aria-label="View Dungeon Meshi"></button>
        <button type="button" class="discover-card-save" aria-pressed="false" aria-label="Shortlist Dungeon Meshi"><svg data-icon="IconBookmark" data-size="16"></svg></button>
        <div class="cover-poster">
          <div class="cover-placeholder" style="background:linear-gradient(160deg, var(--rose-8), var(--dark-8));align-items:start;padding-top:38%;color:var(--dark-0)">Cover art</div>
          <div class="cover-scrim"></div>
          <span class="cover-badge discover-rating"><svg data-icon="IconStarFilled" data-size="12" class="mk-icon"></svg>8.7</span>
          <span class="discover-corner" data-add="true" data-shown aria-hidden="true"><svg data-icon="IconPlus" data-size="16" class="mk-icon"></svg></span>
          <div class="discover-meta">
            
            <span class="cover-title">Dungeon Meshi</span>
            <div class="discover-sub">
              <span class="discover-sub-status">
                <span class="discover-sub-state"><span class="discover-sub-disc" style="--tone:var(--ok);--tone-on:var(--ok-on)"><svg data-icon="IconCheck" data-size="10"></svg></span><span class="discover-sub-word">Completed</span></span>
                <span class="discover-sub-year">2014</span>
              </span>
              <span class="discover-sub-chapters">97 ch.</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="discover-rail-item">
      <div class="cover-card discover-card">
        <button type="button" class="discover-card-action" aria-label="View Frieren"></button>
        <div class="cover-poster">
          <div class="cover-placeholder" style="background:linear-gradient(160deg, var(--emerald-8), var(--dark-8));align-items:start;padding-top:38%;color:var(--dark-0)">Cover art</div>
          <div class="cover-scrim"></div>
          <span class="cover-badge discover-rating"><svg data-icon="IconStarFilled" data-size="12" class="mk-icon"></svg>8.4</span>
          <span class="discover-corner" data-owned="true" aria-hidden="true"><svg data-icon="IconCheck" data-size="16" class="mk-icon"></svg></span>
          <div class="discover-meta">
            
            <span class="cover-title">Frieren</span>
            <div class="discover-sub">
              <span class="discover-sub-status">
                <span class="discover-sub-state"><span class="discover-sub-disc" style="--tone:var(--info);--tone-on:var(--info-on)"><svg data-icon="IconPlayerPlay" data-size="10"></svg></span><span class="discover-sub-word">Ongoing</span></span>
                <span class="discover-sub-year">2020</span>
              </span>
              <span class="discover-sub-chapters">140 ch.</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="discover-rail-item">
      <div class="cover-card discover-card">
        <button type="button" class="discover-card-action" aria-label="View Mushishi Special"></button>
        <div class="cover-poster">
          <div class="cover-placeholder" style="background:linear-gradient(160deg, var(--indigo-7), var(--dark-8));align-items:start;padding-top:38%;color:var(--dark-0)">Cover art</div>
          <div class="cover-scrim"></div>
          <span class="cover-badge discover-rating"><svg data-icon="IconStarFilled" data-size="12" class="mk-icon"></svg>7.9</span>
          <span class="discover-corner" data-saved="true" aria-hidden="true"><svg data-icon="IconBookmarkFilled" data-size="16"></svg></span>
          <div class="discover-meta">
            <span class="discover-reason">Sequel to Mushishi</span>
            <span class="cover-title">Mushishi Special</span>
            <div class="discover-sub">
              <span class="discover-sub-status">
                <span class="discover-sub-state"><span class="discover-sub-disc" style="--tone:var(--ok);--tone-on:var(--ok-on)"><svg data-icon="IconCheck" data-size="10"></svg></span><span class="discover-sub-word">Completed</span></span>
                <span class="discover-sub-year">2014</span>
              </span>
              <span class="discover-sub-chapters">4 ch.</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="discover-rail-item">
      <div class="cover-card discover-card">
        <button type="button" class="discover-card-action" aria-label="View Witch Hat Atelier"></button>
        <div class="cover-poster">
          <div class="cover-placeholder" style="background:linear-gradient(160deg, var(--amber-8), var(--dark-8));align-items:start;padding-top:38%;color:var(--dark-0)">Cover art</div>
          <div class="cover-scrim"></div>
          
          <span class="discover-corner" data-add="true" aria-hidden="true"><svg data-icon="IconPlus" data-size="16" class="mk-icon"></svg></span>
          <div class="discover-meta">
            
            <span class="cover-title">Witch Hat Atelier</span>
            <div class="discover-sub">
              <span class="discover-sub-status">
                <span class="discover-sub-state"><span class="discover-sub-disc" style="--tone:var(--info);--tone-on:var(--info-on)"><svg data-icon="IconPlayerPlay" data-size="10"></svg></span><span class="discover-sub-word">Ongoing</span></span>
                <span class="discover-sub-year">2016</span>
              </span>
              <span class="discover-sub-chapters">78 ch.</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="discover-rail-item">
      <div class="cover-card discover-card">
        <button type="button" class="discover-card-action" aria-label="View Yokohama Kaidashi Kikou"></button>
        <div class="cover-poster">
          <div class="cover-placeholder" style="background:linear-gradient(160deg, var(--dark-4), var(--dark-8));align-items:start;padding-top:38%;color:var(--dark-0)">Cover art</div>
          <div class="cover-scrim"></div>
          <span class="cover-badge discover-rating"><svg data-icon="IconStarFilled" data-size="12" class="mk-icon"></svg>8.1</span>
          <span class="discover-corner" data-add="true" aria-hidden="true"><svg data-icon="IconPlus" data-size="16" class="mk-icon"></svg></span>
          <div class="discover-meta">
            
            <span class="cover-title">Yokohama Kaidashi Kikou</span>
            <div class="discover-sub">
              <span class="discover-sub-status">
                <span class="discover-sub-state"><span class="discover-sub-disc" style="--tone:var(--ok);--tone-on:var(--ok-on)"><svg data-icon="IconCheck" data-size="10"></svg></span><span class="discover-sub-word">Completed</span></span>
                <span class="discover-sub-year">1994</span>
              </span>
              <span class="discover-sub-chapters">142 ch.</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
