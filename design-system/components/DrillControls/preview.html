<!-- @dsCard group="Layout" height=420 subtitle="Static rendition: grouped rows and a multi-pick list, an include and leave-out page, a range page with the footer" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DrillControls preview</title>
<style>
  .mk-input { flex: 1; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--border-control); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); font: inherit; font-size: var(--type-body); }
  .mk-track { flex: 1; height: 4px; border-radius: 2px; background: var(--brand); }
</style>
</head>
<body>
<div class="mk-preview">
  <div class="panel" style="width:290px;padding:6px">
    <div class="drill-group" role="group" aria-label="About the series">
      <div class="drill-choices-heading">About the series</div>
      <button type="button" class="drill-row"><svg data-icon="IconCalendar" data-size="16" class="drill-row-icon"></svg><span class="drill-row-label">Year</span><span class="drill-row-value" data-active>2010 to 2024</span><svg data-icon="IconChevronRight" data-size="16" class="drill-row-chevron"></svg></button>
      <button type="button" class="drill-row"><svg data-icon="IconCalendar" data-size="16" class="drill-row-icon"></svg><span class="drill-row-label">Publisher</span><span class="drill-row-value">Any</span><svg data-icon="IconChevronRight" data-size="16" class="drill-row-chevron"></svg></button>
    </div>
    <div class="drill-choices" role="group" aria-label="Don't enhance">
      <button type="button" class="drill-choice" role="checkbox" aria-checked="true" data-checked data-state="in"><span class="drill-choice-check drill-box"><svg data-icon="IconCheck" data-size="12"></svg></span><span class="drill-choice-text"><span class="drill-choice-label">Colour pages</span></span></button>
      <button type="button" class="drill-choice" role="checkbox" aria-checked="false"><span class="drill-choice-check drill-box"></span><span class="drill-choice-text"><span class="drill-choice-label">Small pages</span></span></button>
    </div>
  </div>

  <div class="panel" style="width:290px;padding:6px">
    <button type="button" class="drill-back drill-panel-back"><span class="drill-back-icon"><svg data-icon="IconArrowLeft" data-size="16"></svg></span><span>Genres</span></button>
    <div class="drill-choices" role="group" aria-label="Genres">
      <button type="button" class="drill-choice" role="checkbox" aria-checked="true" data-checked data-state="in"><span class="drill-choice-check drill-box"><svg data-icon="IconCheck" data-size="12"></svg></span><span class="drill-choice-text"><span class="drill-choice-label">Action</span></span></button>
      <button type="button" class="drill-choice" role="checkbox" aria-checked="false"><span class="drill-choice-check drill-box"></span><span class="drill-choice-text"><span class="drill-choice-label">Comedy</span></span></button>
      <button type="button" class="drill-choice" role="checkbox" aria-checked="false" data-state="out"><span class="drill-choice-check drill-box"><svg data-icon="IconMinus" data-size="12"></svg></span><span class="drill-choice-text"><span class="drill-choice-label">Horror</span><span class="drill-choice-hint">Left out</span></span></button>
      <button type="button" class="drill-choice" role="checkbox" aria-checked="false"><span class="drill-choice-check drill-box"></span><span class="drill-choice-text"><span class="drill-choice-label">Romance</span></span></button>
    </div>
  </div>

  <div class="panel" style="width:290px;padding:6px">
    <button type="button" class="drill-back drill-panel-back"><span class="drill-back-icon"><svg data-icon="IconArrowLeft" data-size="16"></svg></span><span>Year</span></button>
    <div class="drill-field">
      <div class="drill-field-title"><svg data-icon="IconCalendar" data-size="16"></svg><span>Year</span></div>
      <div class="drill-range"><input class="mk-input" value="2010" aria-label="Earliest year"><input class="mk-input" placeholder="To" aria-label="Latest year"></div>
      <div class="drill-field-help">Leave both boxes empty to ignore.</div>
    </div>
    <div class="drill-field">
      <div class="drill-field-title"><svg data-icon="IconCalendar" data-size="16"></svg><span>Read</span></div>
      <div class="drill-slider"><span class="drill-slider-name">From</span><span class="mk-track"></span><span class="drill-slider-value">0%</span></div>
      <div class="drill-slider"><span class="drill-slider-name">To</span><span class="mk-track"></span><span class="drill-slider-value">100%</span></div>
    </div>
    <div class="drill-footer" style="margin:6px -6px -6px;padding:10px 12px">
      <span class="mk-button" data-variant="subtle">Reset</span>
      <div class="drill-footer-end"><span class="drill-footer-status">128 series</span><span class="mk-button">Done</span></div>
    </div>
  </div>
</div>
</body>
</html>
