<!-- @dsCard group="Layout" height=360 subtitle="Static rendition: the first page, a choices page and a field page" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>DrillPanel preview</title></head>
<body>
<div class="mk-preview">
  <div class="panel" style="width:290px;padding:6px">
    <button type="button" class="drill-row">
      <svg class="drill-row-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></svg>
      <span class="drill-row-label">Folder</span><span class="drill-row-value">/library/manga</span>
      <svg class="drill-row-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button type="button" class="drill-row">
      <svg class="drill-row-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>
      <span class="drill-row-label">Incognito</span><span class="drill-row-value">Off</span>
      <svg class="drill-row-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button type="button" class="drill-row">
      <svg class="drill-row-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <span class="drill-row-label">Automation</span><span class="drill-row-value">Smart</span>
      <svg class="drill-row-chevron" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>

  <div class="panel" style="width:290px;padding:6px">
    <button type="button" class="drill-back drill-panel-back">
      <span class="drill-back-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span>
      <span>Incognito</span>
    </button>
    <div class="drill-choices" role="radiogroup" aria-label="Incognito">
      <button type="button" class="drill-choice" role="radio" aria-checked="true" data-checked>
        <span class="drill-choice-check"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></span>
        <span class="drill-choice-text"><span class="drill-choice-label">Off</span><span class="drill-choice-hint">Reading counts in your stats and goes to your trackers.</span></span>
      </button>
      <button type="button" class="drill-choice" role="radio" aria-checked="false">
        <span class="drill-choice-check"></span>
        <span class="drill-choice-text"><span class="drill-choice-label">No scrobble</span><span class="drill-choice-hint">Reading counts in your stats but isn't sent to your trackers.</span></span>
      </button>
    </div>
  </div>

  <div class="panel" style="width:290px;padding:6px">
    <button type="button" class="drill-back drill-panel-back">
      <span class="drill-back-icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span>
      <span>Automation</span>
    </button>
    <div class="drill-field">
      <div class="drill-field-title"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span>Monitor</span></div>
      <div class="mk-segmented"><span>All</span><span data-checked>Smart</span><span>Main only</span><span>None</span></div>
      <div class="drill-field-help">Chapters released from now on are wanted and queued a batch at a time, ahead of where you're reading.</div>
    </div>
  </div>
</div>
</body>
</html>
