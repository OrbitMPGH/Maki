<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>EmptyState preview</title></head>
<body>
<div class="mk-preview" data-stack style="padding-top:0;padding-bottom:0">
  <div class="empty-state">
    <div class="empty-state-title">No series yet</div>
    <div class="empty-state-description">Add one from Discover or search by title. Maki finds its chapters and keeps it complete.</div>
    <button class="mk-button" data-variant="default">Browse the catalogue</button>
  </div>
  <div class="empty-state" data-compact>
    <div class="empty-state-title">Queue is empty</div>
    <div class="empty-state-description">Nothing is waiting to download.</div>
  </div>
</div>
</body>
</html>
