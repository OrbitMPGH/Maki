<!-- @dsCard group="Data" height=250 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FigureStrip preview</title></head>
<body>
<div class="mk-preview" data-stack>
  <div class="figure-strip">
    <div class="figure-strip-item"><span class="figure-strip-n figure">42</span><span class="figure-strip-l">Queued</span></div>
    <div class="figure-strip-item"><span class="figure-strip-n figure" style="color:var(--info)">3</span><span class="figure-strip-l">Downloading</span></div>
    <div class="figure-strip-item"><span class="figure-strip-n figure" style="color:var(--ok)">1,207</span><span class="figure-strip-l">Imported</span></div>
    <div class="figure-strip-item" data-zero><span class="figure-strip-n figure">0</span><span class="figure-strip-l">Failed</span></div>
  </div>
  <div class="figure-strip" data-variant="panel">
    <div class="figure-strip-item"><span class="figure-strip-n figure">1,284</span><span class="figure-strip-l">Series</span></div>
    <div class="figure-strip-item"><span class="figure-strip-n figure">96</span><span class="figure-strip-l">Monitored</span></div>
    <div class="figure-strip-item"><span class="figure-strip-n figure" style="color:var(--ok)">71</span><span class="figure-strip-l">On disk</span></div>
    <div class="figure-strip-item"><span class="figure-strip-n figure" style="color:var(--warn)">1,713</span><span class="figure-strip-l">Missing</span></div>
    <div class="figure-strip-item"><span class="figure-strip-n figure">2,140</span><span class="figure-strip-l">Unread</span></div>
    <div class="figure-strip-item"><span class="figure-strip-n figure">12</span><span class="figure-strip-l">Started</span></div>
    <div class="figure-strip-item"><span class="figure-strip-n figure" style="color:var(--ok)">30</span><span class="figure-strip-l">Finished</span></div>
  </div>
</div>
</body>
</html>
