<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FigureStrip preview</title></head>
<body>
<div class="mk-preview" data-stack>
  <div class="figure-strip">
    <div class="figure-strip-item"><span class="figure-strip-n tnum">42</span><span class="figure-strip-l">Queued</span></div>
    <div class="figure-strip-item"><span class="figure-strip-n tnum" style="color:var(--info)">3</span><span class="figure-strip-l">Downloading</span></div>
    <div class="figure-strip-item"><span class="figure-strip-n tnum" style="color:var(--ok)">1,207</span><span class="figure-strip-l">Imported</span></div>
    <div class="figure-strip-item" data-zero><span class="figure-strip-n tnum">0</span><span class="figure-strip-l">Failed</span></div>
  </div>
</div>
</body>
</html>
