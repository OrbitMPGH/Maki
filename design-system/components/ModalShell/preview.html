<!-- @dsCard group="Feedback" height=330 subtitle="Static rendition of a utility modal using ModalHeading, Note and ModalFooter" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ModalShell preview</title></head>
<body>
<div class="mk-overlay">
  <div class="utility-modal-content" role="dialog" aria-label="Rename files" style="width:min(560px,100%)">
    <div class="utility-modal-header">
      <h2 class="utility-modal-title">
        <span class="modal-heading-title">Rename files</span>
        <span class="modal-heading-description" aria-hidden="true">Matches your naming formats. Only the highlighted parts change.</span>
      </h2>
      <button class="utility-modal-close" aria-label="Close"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon" aria-hidden="true"><path d="M18 6l-12 12" /><path d="M6 6l12 12" /></svg></button>
    </div>
    <div class="utility-modal-body" style="--mb-padding:20px">
      <div class="note" data-tone="warn" role="status">
        <svg class="note-icon" width="16" height="16" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M236.8,188.09,149.35,36.22a24.76,24.76,0,0,0-42.7,0L19.2,188.09a23.51,23.51,0,0,0,0,23.72A24.35,24.35,0,0,0,40.55,224h174.9a24.35,24.35,0,0,0,21.33-12.19A23.51,23.51,0,0,0,236.8,188.09ZM120,104a8,8,0,0,1,16,0v40a8,8,0,0,1-16,0Zm8,84a12,12,0,1,1,12-12A12,12,0,0,1,128,188Z"/></svg>
        <div class="note-body">Two chapters want one name. Add {Chapter Language} to the chapter format to tell them apart.</div>
      </div>
      <div class="modal-footer">
        <div class="modal-footer-status">14 files will be renamed</div>
        <div class="modal-footer-actions">
          <button class="mk-button" data-variant="default">Cancel</button>
          <button class="mk-button">Rename files</button>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
