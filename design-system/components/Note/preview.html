<!-- @dsCard group="Feedback" height=190 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Note preview</title></head>
<body>
<div class="mk-preview" data-stack style="gap:12px">
  <div class="note" data-tone="warn">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon note-icon" aria-hidden="true"><path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0z"/><path d="M12 16h.01"/></svg>
    <div class="note-body">Backups hold API keys and passwords in plain text. Treat a downloaded one like a password.</div>
  </div>
  <div class="note" data-tone="info">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon note-icon" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M12 9h.01"/><path d="M11 12h1v4h1"/></svg>
    <div class="note-body">Changes apply to chapters downloaded from now on.</div>
    <div class="note-action"><button class="mk-button" data-variant="subtle" data-size="xs">Apply to existing</button></div>
  </div>
  <div class="note" data-tone="ok">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon note-icon" aria-hidden="true"><path d="M5 12l5 5l10 -10"/></svg>
    <div class="note-body">Saved.</div>
  </div>
  <div class="note" data-tone="neutral">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon note-icon" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0"/><path d="M12 9h.01"/><path d="M11 12h1v4h1"/></svg>
    <div class="note-body">Nothing is sent until a connection is added.</div>
  </div>
</div>
</body>
</html>
