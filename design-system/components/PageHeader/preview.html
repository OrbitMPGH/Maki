<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PageHeader preview</title></head>
<body>
<div class="mk-preview" data-stack style="gap:28px">
  <div class="page-header">
    <div class="page-header-text">
      <h1 class="page-header-title">Library</h1>
      <p class="page-header-description">Every series Maki monitors. New chapters download on their own.</p>
    </div>
    <div class="page-header-actions">
      <button class="mk-button" data-variant="default"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon" aria-hidden="true" > <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" /> <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" /> </svg> Rescan</button>
      <button class="mk-button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon" aria-hidden="true" > <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M12 5l0 14" /> <path d="M5 12l14 0" /> </svg> Add series</button>
    </div>
  </div>
  <div class="page-header" data-compact>
    <div class="page-header-text">
      <h1 class="page-header-title">Queue</h1>
      <p class="page-header-description">Chapters waiting for a download slot.</p>
    </div>
  </div>
</div>
</body>
</html>
