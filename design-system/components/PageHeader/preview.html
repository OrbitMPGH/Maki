<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PageHeader preview</title></head>
<body>
<div class="mk-preview" data-stack style="gap:28px">
  <div class="page-header">
    <div class="page-header-text">
      <h1 class="page-header-title">Library</h1>
    </div>
    <div class="page-header-actions">
      <button class="mk-button" data-variant="default"><svg data-icon="IconListCheck"></svg> Select</button>
      <button class="mk-button"><svg data-icon="IconPlus" data-size="16" class="mk-icon"></svg> Add series</button>
    </div>
  </div>
  <div class="page-header" data-compact>
    <div class="page-header-text">
      <h1 class="page-header-title">Queue</h1>
      <p class="page-header-description">Chapters waiting for a download slot.</p>
    </div>
  </div>
</div>
</body>
</html>
