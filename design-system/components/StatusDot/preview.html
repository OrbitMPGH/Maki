<!-- @dsCard group="Status" height=72 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StatusDot preview</title></head>
<body>
<div class="mk-preview" style="align-items:center;gap:22px">
  <span class="status-dot" style="--dot:var(--info)" data-live>Downloading</span>
  <span class="status-dot" style="--dot:var(--ok)">Imported</span>
  <span class="status-dot" style="--dot:var(--warn)">Retrying</span>
  <span class="status-dot" style="--dot:var(--danger)">Failed</span>
  <span class="status-dot" style="--dot:var(--neutral)">Idle</span>
</div>
</body>
</html>
