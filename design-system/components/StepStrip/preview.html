<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>StepStrip preview</title></head>
<body>
<div class="mk-preview" data-stack>
  <ol class="step-strip" data-layout="strip" aria-label="Import steps" style="grid-template-columns:repeat(3,minmax(0,1fr))">
    <li><div class="step-strip-item" data-state="done"><span class="step-strip-index"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13" aria-hidden="true"><path d="M5 12l5 5l10 -10"/></svg></span><span class="step-strip-text"><span class="step-strip-label">Library</span><span class="step-strip-hint">3 folders</span></span><span class="step-strip-thread" aria-hidden="true"></span></div></li>
    <li><div class="step-strip-item" data-state="current" aria-current="step"><span class="step-strip-index">2</span><span class="step-strip-text"><span class="step-strip-label">Match</span><span class="step-strip-hint" data-tone="warn">4 need review</span></span><span class="step-strip-thread" aria-hidden="true"></span></div></li>
    <li><div class="step-strip-item" data-state="todo"><span class="step-strip-index">3</span><span class="step-strip-text"><span class="step-strip-label">Import</span></span></div></li>
  </ol>
</div>
</body>
</html>
