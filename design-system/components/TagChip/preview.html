<!-- @dsCard group="Status" height=110 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TagChip preview</title></head>
<body>
<div class="mk-preview" data-stack>
  <div class="tag-chips">
    <span class="tag-chip"><span class="tag-dot" style="--bucket:var(--info)"></span><span class="tag-chip-body">Fantasy</span></span>
    <span class="tag-chip"><span class="tag-dot" style="--bucket:var(--watched)"></span><span class="tag-chip-body">Slow life</span></span>
    <button class="tag-chip" data-interactive data-active><span class="tag-dot"></span><span class="tag-chip-body">Adventure</span></button>
    <button class="tag-chip" data-interactive><span class="tag-chip-body">Elves</span></button>
    <span class="tag-chip" data-size="sm"><span class="tag-chip-body">Award winner</span></span>
  </div>
</div>
</body>
</html>
