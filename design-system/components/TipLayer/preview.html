<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TipLayer preview</title></head>
<body>
<div class="mk-preview" style="position:relative;height:150px;gap:0">
  <div style="position:absolute;left:40px;top:66px">
    <span class="cover-badge cover-badge-circle" data-dim style="width:24px;height:24px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mk-icon" aria-hidden="true" > <path stroke="none" d="M0 0h24v24H0z" fill="none" /> <path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /> <path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6" /> </svg></span>
    <div class="tip" data-open style="left:-31px;bottom:34px;white-space:nowrap">Monitored</div>
  </div>
  <div style="position:absolute;left:220px;top:22px">
    <span class="cover-badge cover-badge-unread">4</span>
    <div class="tip" data-open data-below style="left:-29px;top:30px;white-space:nowrap">4 unread</div>
  </div>
  <div style="position:absolute;left:400px;top:92px">
    <span class="cover-count tnum" style="color:var(--ink-3)">0/24</span>
    <div class="tip" data-open style="left:-90px;bottom:28px;width:220px">24 chapters listed, none wanted, nothing will download</div>
  </div>
</div>
</body>
</html>
