<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover: iPadOS draws the page under its status bar regardless of the meta below,
         so theme.css takes the whole screen and pads with the safe-area insets itself. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Maki</title>
    <meta
      name="description"
      content="Monitors manga sources for new chapters, downloads them as CBZ, and reads them."
    />

    <!-- Installable to a phone or desktop home screen. The reader already takes over the whole
         viewport and hides its own chrome, so running it standalone (no address bar) gives it the
         vertical space it was designed for. `theme-color` here is the initial value only;
         theme-init.js and then theme-context rewrite it when the theme changes. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0b0b" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="Maki" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `black`, not `black-translucent`: an iPhone keeps an opaque bar above the page and reports
         a zero top inset. iPadOS ignores it, which is what the safe-area padding is for. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- External rather than inline: the CSP's script-src is 'self'. Runs before first paint. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
