ot;slug&quot;:&quot;chap-08-322&quot;},{&quot;id&quot;:33454,&quot;name&quot;:&quot;chap 07&quot;,&quot;slug&quot;:&quot;chap-07-329&quot;},{&quot;id&quot;:33453,&quot;name&quot;:&quot;chap 06&quot;,&quot;slug&quot;:&quot;chap-06-340&quot;},{&quot;id&quot;:33452,&quot;name&quot;:&quot;chap 05&quot;,&quot;slug&quot;:&quot;chap-05-340&quot;},{&quot;id&quot;:33451,&quot;name&quot;:&quot;chap 04&quot;,&quot;slug&quot;:&quot;chap-04-345&quot;},{&quot;id&quot;:33450,&quot;name&quot;:&quot;chap 03&quot;,&quot;slug&quot;:&quot;chap-03-359&quot;},{&quot;id&quot;:33449,&quot;name&quot;:&quot;Chap 02&quot;,&quot;slug&quot;:&quot;chap-02-363&quot;},{&quot;id&quot;:33448,&quot;name&quot;:&quot;Chap 01&quot;,&quot;slug&quot;:&quot;chap-01-361&quot;}],&quot;prevChapterUrl&quot;:null,&quot;nextChapterUrl&quot;:&quot;\/manga\/secret-class\/chap-02-363&quot;,&quot;isFirstChapter&quot;:true,&quot;isLastChapter&quot;:false,&quot;notifications&quot;:[],&quot;characters&quot;:[{&quot;id&quot;:78,&quot;name&quot;:&quot;Minji&quot;,&quot;description&quot;:&quot;&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;type_name&quot;:&quot;Unknown&quot;},{&quot;id&quot;:79,&quot;name&quot;:&quot;Jihun&quot;,&quot;description&quot;:&quot;Hair color style: Dark brown, often slightly tousled but generally neat, a medium length that falls just above his eyes when he&#039;s tired or thoughtful.\nEye color: Warm brown, usually holding a quiet intensity or a hint of underlying nervousness. They tend to widen slightly when he&#039;s surprised or intrigued.\nBody build: Lean but not overly thin, with an athletic build that suggests he&#039;s active but not heavily muscled. He carries himself with a casual grace.\nHeight: Around 5&#039;10\&quot; (178 cm), tall enough to be noticeable but not towering.\nTypical clothing: Prefers comfortable, casual wear: jeans, t-shirts, hoodies, and simple button-down shirts. His style is understated, practical, and clean, often in neutral tones like grey, black, white, and muted blues. He doesn&#039;t draw attention to himself with flashy clothes.\nDistinguishing features: A subtle, almost imperceptible furrow in his brow when he&#039;s deep in thought or feeling conflicted. He has a gentle smile that doesn&#039;t always reach his eyes, especially early on, hinting at his inner turmoil.&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;type_name&quot;:&quot;Unknown&quot;},{&quot;id&quot;:80,&quot;name&quot;:&quot;Hyejin&quot;,&quot;description&quot;:&quot;Hyejin is a young woman with long, straight, dark brown hair that often falls past her shoulders, sometimes styled simply or in a casual ponytail, with soft bangs that frame her youthful face. Her large, expressive dark brown eyes are her most striking feature, capable of conveying everything from innocent curiosity to intense longing or mischievous intent. She has a petite and slender build, still retaining a youthful figure, and is on the shorter side for her age, which sometimes makes her feel a bit younger than she wants to appear. Her typical clothing style leans towards casual, cute, and trendy outfits \u2013 often favoring skirts, stylish hoodies, or fashionable tops that highlight her youth while subtly hinting at her desire to appear more mature. When in her school uniform, she often tries to personalize it with small accessories. A distinguishing feature is her tendency to blush easily, especially when flustered or around Jihun, and her youthful energy is almost palpable in her demeanor.&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;type_name&quot;:&quot;Unknown&quot;},{&quot;id&quot;:81,&quot;name&quot;:&quot;Jihyun&quot;,&quot;description&quot;:&quot;Jihyun is a strikingly elegant young woman with long, dark hair that she often keeps styled neatly, sometimes with a subtle wave or perfectly straight. Her eyes are a deep, expressive brown, often reflecting a thoughtful intensity or a hidden vulnerability. She has a slim and graceful build, standing at an average height, perhaps around 168cm, making her slightly taller than her younger sister. Her typical clothing leans towards more mature and sophisticated casual wear \u2013 think tailored blouses, fitted skirts, dresses, or stylish cardigans, along with her school uniform when applicable. She carries herself with a quiet poise, a subtle elegance that distinguishes her.&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;type_name&quot;:&quot;Unknown&quot;},{&quot;id&quot;:82,&quot;name&quot;:&quot;Minwoo&quot;,&quot;description&quot;:&quot;Hair color style: Dark brown, neatly combed back but often slightly disheveled after a long flight or day. A few strands of grey are starting to appear at the temples, hinting at his age and stress.\nEye color: Warm brown, often appearing tired or preoccupied, but capable of showing deep affection when focused on his family. They hold a certain earnestness, a desire to do right.\nBody build: Average build, perhaps a little broader in the shoulders from his younger days, but now leaning towards a slight softness around the midsection due to long hours sitting and irregular meals. He&#039;s not out of shape, but definitely not athletic.\nHeight: Around 5&#039;10\&quot; (178 cm), a respectable height that makes him feel substantial but not towering.\nTypical clothing: When at work or traveling, he&#039;s almost always in well-tailored business suits or smart business casual (dress shirts, slacks, blazers). At home, he opts for comfortable, slightly worn polo shirts, simple t-shirts, and relaxed trousers or sweatpants. He values practicality and a presentable appearance.\nDistinguishing features: A faint line between his eyebrows from frequent frowning or concentrating, a slightly weary but kind smile, and hands that often fidget with his watch or phone, a sign of his busy mind.&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;type_name&quot;:&quot;Unknown&quot;},{&quot;id&quot;:83,&quot;name&quot;:&quot;Professor Park&quot;,&quot;description&quot;:&quot;Professor Park is a man in his late 40s, with a distinguished, somewhat academic appearance. His hair is a neat, salt-and-pepper blend, typically styled back from his forehead, giving him an air of intellectual gravitas. He has sharp, observant eyes, often framed by stylish, thin-rimmed glasses that he occasionally pushes up his nose with a thoughtful gesture. He maintains a lean, almost wiry build, suggesting a preference for intellectual pursuits over physical ones, though he carries himself with an understated confidence. Standing around 5&#039;10\&quot;, he&#039;s not towering but commands attention through his presence. His typical attire consists of smart-casual or business-casual outfits \u2013 tailored blazers, crisp button-down shirts (often open at the collar), dark trousers, and polished leather shoes. He eschews flashy accessories, preferring subtle elegance. A distinguishing feature might be the slight, almost imperceptible smirk that often plays on his lips when he&#039;s made a particularly clever observation or is amused by something only he seems to grasp.&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;type_name&quot;:&quot;Unknown&quot;},{&quot;id&quot;:84,&quot;name&quot;:&quot;Yumi&quot;,&quot;description&quot;:&quot;Yumi is a young woman with long, dark brown hair that often falls past her shoulders, though she sometimes ties it back in a neat ponytail or bun when working to keep it out of the way. Her eyes are a warm, dark brown, often wide with a hint of shyness but also capable of sparkling with quiet determination. She has a slender, slightly petite build, standing at an average height for a woman, perhaps a bit shorter than Jihun. At the cafe, she&#039;s always in her clean, crisp uniform \u2013 an apron over a simple top and trousers. Outside of work, her style leans towards comfortable but sweet, often choosing soft sweaters, flowy skirts, or well-fitting jeans, favoring pastel colors or earthy tones. She has a gentle smile that tends to appear when she&#039;s happy or a little flustered, and she often has a small, unassuming accessory, like a delicate necklace or a simple hair clip.&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;type_name&quot;:&quot;Unknown&quot;},{&quot;id&quot;:85,&quot;name&quot;:&quot;Mr. Kim&quot;,&quot;description&quot;:&quot;Mr. Kim is a man in his late 40s to early 50s, with a sturdy, slightly rounded build that suggests years of standing on his feet and perhaps enjoying a few too many pastries. His hair is a practical, short-cropped dark brown, showing a few strands of grey at the temples, always neatly combed but never overly styled. His eyes are a warm, observant brown, often crinkling at the corners when he&#039;s amused or deep in thought, though they can also narrow with a no-nonsense intensity when business calls. He stands at an average height, perhaps 5&#039;8\&quot; or 5&#039;9\&quot;. His typical attire consists of clean, practical clothing \u2013 usually a collared shirt, often a muted plaid or solid color, paired with dark trousers and a sensible apron when he&#039;s behind the counter. He prefers comfort and utility over fashion. A distinguishing feature might be the slight calluses on his hands from years of working, or the faint scent of roasted coffee that seems to cling to him.&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;type_name&quot;:&quot;Unknown&quot;}],&quot;gachaBanner&quot;:{&quot;id&quot;:5,&quot;name&quot;:&quot;Jeong Eun-ae&quot;,&quot;character_name&quot;:&quot;Jeong Eun-ae&quot;},&qu
