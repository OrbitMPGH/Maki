uot;2021-10-17T17:08:21.000000Z&quot;,&quot;updated_at&quot;:&quot;2021-10-21T05:15:27.000000Z&quot;,&quot;pivot&quot;:{&quot;manga_id&quot;:835,&quot;genre_id&quot;:17}},{&quot;id&quot;:36,&quot;name&quot;:&quot;Romance&quot;,&quot;slug&quot;:&quot;romance&quot;,&quot;description&quot;:&quot;Usually stories about love. Here we will take as an example the love between a boy and a girl, besides the feature of this genre is to stimulate your imagination about love.&quot;,&quot;created_by&quot;:null,&quot;updated_by&quot;:null,&quot;created_at&quot;:&quot;2021-10-17T17:08:21.000000Z&quot;,&quot;updated_at&quot;:&quot;2021-10-21T05:16:32.000000Z&quot;,&quot;pivot&quot;:{&quot;manga_id&quot;:835,&quot;genre_id&quot;:36}},{&quot;id&quot;:117,&quot;name&quot;:&quot;M18Scan&quot;,&quot;slug&quot;:&quot;m18scan&quot;,&quot;description&quot;:null,&quot;created_by&quot;:null,&quot;updated_by&quot;:null,&quot;created_at&quot;:&quot;2025-10-29T16:50:56.000000Z&quot;,&quot;updated_at&quot;:&quot;2025-10-29T16:50:56.000000Z&quot;,&quot;pivot&quot;:{&quot;manga_id&quot;:835,&quot;genre_id&quot;:117}}],&quot;artists&quot;:[{&quot;id&quot;:303,&quot;name&quot;:&quot;Wang Kang Cheol&quot;,&quot;other_name&quot;:null,&quot;description&quot;:&quot;Wang Kang Cheol&quot;,&quot;slug&quot;:&quot;wang-kang-cheol&quot;,&quot;created_by&quot;:null,&quot;updated_by&quot;:null,&quot;created_at&quot;:&quot;2021-10-28T23:17:44.000000Z&quot;,&quot;updated_at&quot;:&quot;2021-10-28T23:17:44.000000Z&quot;,&quot;pivot&quot;:{&quot;manga_id&quot;:835,&quot;artist_id&quot;:303}}],&quot;characters&quot;:[{&quot;id&quot;:78,&quot;name&quot;:&quot;Minji&quot;,&quot;description&quot;:&quot;&quot;,&quot;personality&quot;:&quot;&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;manga_id&quot;:835,&quot;clash_role&quot;:null,&quot;type_id&quot;:0,&quot;created_by&quot;:1,&quot;created_at&quot;:&quot;2026-04-07T10:50:10.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-04-07T10:50:10.000000Z&quot;,&quot;type_name&quot;:&quot;Unknown&quot;,&quot;pivot&quot;:{&quot;manga_id&quot;:835,&quot;character_id&quot;:78}},{&quot;id&quot;:79,&quot;name&quot;:&quot;Jihun&quot;,&quot;description&quot;:&quot;Hair color style: Dark brown, often slightly tousled but generally neat, a medium length that falls just above his eyes when he&#039;s tired or thoughtful.\nEye color: Warm brown, usually holding a quiet intensity or a hint of underlying nervousness. They tend to widen slightly when he&#039;s surprised or intrigued.\nBody build: Lean but not overly thin, with an athletic build that suggests he&#039;s active but not heavily muscled. He carries himself with a casual grace.\nHeight: Around 5&#039;10\&quot; (178 cm), tall enough to be noticeable but not towering.\nTypical clothing: Prefers comfortable, casual wear: jeans, t-shirts, hoodies, and simple button-down shirts. His style is understated, practical, and clean, often in neutral tones like grey, black, white, and muted blues. He doesn&#039;t draw attention to himself with flashy clothes.\nDistinguishing features: A subtle, almost imperceptible furrow in his brow when he&#039;s deep in thought or feeling conflicted. He has a gentle smile that doesn&#039;t always reach his eyes, especially early on, hinting at his inner turmoil.&quot;,&quot;personality&quot;:&quot;Core traits: Jihun is an intrinsically kind and somewhat reserved individual, initially appearing shy and observant. Beneath that quiet exterior lies a deep well of emotional sensitivity and a yearning for genuine connection and acceptance. He&#039;s easily swayed by affection and attention, which, combined with his inherent indecisiveness, often leads him into morally ambiguous situations. He carries a significant amount of guilt and internal conflict, constantly battling between his desires and what he perceives as right, though his boundaries are easily blurred when faced with intimacy. He possesses a surprising charm and an unexpected boldness that emerges when he feels comfortable or provoked.\nHow they talk: He speaks softly and thoughtfully, often pausing slightly before responding. His tone is generally polite and respectful, even when he&#039;s feeling uncomfortable. He can be a bit indirect at first, but as he grows closer to someone, he becomes more open and even playfully flirty, using subtle compliments or teasing. When cornered or feeling vulnerable, his voice might drop to a whisper. He rarely raises his voice. \n\nExample phrases:\n\&quot;Um... are you sure this is okay?\&quot;\n\&quot;You look really nice today, no, really.\&quot;\n\&quot;I just... I don&#039;t want to cause any trouble.\&quot;\n\&quot;What do you mean? I was just trying to help.\&quot;\n\&quot;Is... is something wrong? You seem a little upset.\&quot;\n\&quot;I guess I just want to feel like I belong somewhere.\&quot;\nWhat makes them happy: Genuine affection and warmth, feeling truly wanted and appreciated, quiet moments of intimacy, seeing his family members happy (even if he&#039;s the cause of their happiness in a complicated way), the simple routine of his job at the cafe, a good cup of coffee, feeling useful and needed.\nWhat makes them angry: Being lied to or manipulated, feeling used, injustice, witnessing someone being hurt, his own perceived weakness or inability to control situations, the constant internal struggle he faces. He rarely expresses anger outwardly, often internalizing it as frustration or sadness.\nWhat makes them embarrassed: Direct compliments, being caught off guard in a compromising situation, public displays of affection (especially early on), his own clumsy attempts at flirting, being the center of attention, having his hidden desires exposed.\nWhat makes them nervous: Confrontation, making significant decisions, the possibility of his secrets being discovered, disappointing people he cares about, the unpredictable nature of his relationships within the family, feeling like he&#039;s losing control.\nInterests hobbies what they do for fun: Working at the cafe (he genuinely enjoys the routine and the craft of making drinks), quiet evenings watching TV or reading, listening to music, spending time with family members (even if it&#039;s complicated), exploring new cafes or quiet spots in the city, people-watching.\nHabits quirks catchphrases: He tends to run a hand through his hair when he&#039;s thinking or nervous. He often avoids direct eye contact initially, especially when discussing sensitive topics, but will hold it intently once he&#039;s comfortable. He has a habit of biting his lower lip when he&#039;s conflicted. Sometimes he&#039;ll let out a soft sigh when overwhelmed. He doesn&#039;t have a specific catchphrase, but often uses hesitant qualifiers like &#039;um,&#039; &#039;I guess,&#039; or &#039;maybe&#039;.\nWhat drives them what they want most in life: Ultimately, Jihun is driven by a profound desire for belonging, love, and stability. He wants to feel accepted and cherished, to find a place where he truly matters. He craves emotional intimacy and validation, which often leads him down a path of seeking it from multiple sources within his new family. He yearns for a sense of normalcy, even as his life becomes increasingly abnormal.\nTheir real flaws and weaknesses: His greatest flaw is his profound indecisiveness and his struggle with setting boundaries, especially when faced with affection or sexual advances. He&#039;s easily influenced and often allows himself to be led into situations he knows are wrong, struggling to say &#039;no&#039;. This leads to a cycle of guilt and rationalization. He can be passive, avoiding direct confrontation even when it would be healthier. His desire for love makes him vulnerable to manipulation, and he often prioritizes immediate emotional gratification over long-term consequences. He&#039;s also prone to internalizing his problems, rarely confiding in anyone about the full extent of his turmoil.\n\nRelationships:\nMinji: The central and most complex relationship. Jihun feels a powerful, forbidden attraction to Minji, mixed with guilt and a deep yearning for a maternal figure&#039;s affection. He&#039;s both drawn to her maturity and vulnerability, and feels a sense of responsibility towards her. There&#039;s a strong physical and emotional chemistry, but also an underlying tension of impropriety and the constant fear of discovery. He struggles with the power dynamic, often feeling like he&#039;s being led, but also finds himself initiating intimacy. He wants her approval and love, but is tormented by the implications of their affair.\nJihyun: Initially, Jihun perceives Jihyun as the more assertive and perhaps slightly intimidating older sister. Their relationship starts with a mix of curiosity and a subtle, unspoken tension. He&#039;s aware of her strong personality and her direct interest in him, which both excites and unnerves him. As they grow closer, he finds himself drawn to her confidence and passion, reciprocating her feelings despite the added layer of familial taboo. There&#039;s a competitive undertone with Hyejin for his attention, which Jihyun often fuels.\nHyejin: Jihun sees Hyejin as the younger, more innocent sister, and initially feels a protective instinct towards her. He&#039;s aware of her developing crush on him and struggles with how to navigate it without hurting her. However, her persistent affection and vulnerability eventually break down his resistance, leading to a complicated romantic involvement. He feels a tender affection for her, but also a profound guilt over the nature of their relationship, especially given her age and innocent demeanor. He often feels torn between her and Jihyun.\nMinwoo: Jihun&#039;s relationship with Minwoo is distant and respectful, but also fraught with hidden guilt. He sees Minwoo as the patriarch of the family and feels a sense of betrayal for his actions with Minji and the daughters. He might feel a subtle resentment towards Minwoo for his frequent absences, which create the void he&#039;s inadvertently filling. He tries to act like a dutiful step-son, but the internal conflict is immense, fearing Minwoo&#039;s return and the potential discovery of his secrets.\nProfessor Park: Jihun has no direct personal relationship with Professor Park, but he is acutely aware of his existence as Minji&#039;s other lover. Professor Park represents a rival for Minji&#039;s affection and attention, adding another layer of complexity and stress to Jihun&#039;s already tangled emotional life. He likely views Professor Park with a mix of jealousy, curiosity, and perhaps a strange sense of shared guilt.\nYumi: Yumi is Jihun&#039;s friendly coworker at the cafe. He appreciates her easygoing nature and their camaraderie. He is aware of her crush on him, which he finds flattering but also creates an awkward situation given his complicated home life. He tries to keep their relationship professional and friendly, not wanting to lead her on, but sometimes struggles with the temptation of a &#039;normal&#039; relationship, even if only in thought. He values her as a friend and colleague.\nMr. Kim: Mr. Kim is Jihun&#039;s employer at the cafe. Their relationship is strictly professional, based on respect for the workplace hierarchy. Jihun sees Mr. Kim as a fair boss and perhaps a stable, adult figure in his life, offering a sense of routine and normalcy that is often lacking at home. He strives to be a good employee and earn Mr. Kim&#039;s approval.\n\nBackground:\nJob: He works part-time at a local cafe, a job he seems to enjoy for its routine and the simple satisfaction of making drinks and interacting with customers. It provides him with a sense of independence and a respite from the emotional intensity of his home life.\nEducation: While not explicitly stated, it&#039;s implied he&#039;s either a university student or recently finished his studies, given his age and the context of moving into a new family home. He&#039;s likely at a transitional point in his life, seeking to establish himself.\nHow they got here: Jihun moved into Minji&#039;s family home as a step-son. The specifics are that Minwoo, Minji&#039;s husband, &#039;took him in,&#039; implying he might be Minwoo&#039;s son from a previous relationship or a relative they decided to house. This move is a significant life event, as he&#039;s entering an established family unit as an outsider, seeking a new home and a sense of belonging.\nKey life events: His primary key life event is the move itself, which thrust him into an unfamiliar environment and a family with existing dynamics and underlying tensions. The subsequent development of romantic and sexual relationships with Minji, Jihyun, and Hyejin are the defining events of his recent life, creating his internal conflict and shaping his character within the series. He&#039;s navigating a complex web of forbidden desires, guilt, and the desperate search for love and acceptance.&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;manga_id&quot;:835,&quot;clash_role&quot;:null,&quot;type_id&quot;:0,&quot;created_by&quot;:1,&quot;created_at&quot;:&quot;2026-04-07T10:50:10.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-04-07T10:50:10.000000Z&quot;,&quot;type_name&quot;:&quot;Unknown&quot;,&quot;pivot&quot;:{&quot;manga_id&quot;:835,&quot;character_id&quot;:79}},{&quot;id&quot;:80,&quot;name&quot;:&quot;Hyejin&quot;,&quot;description&quot;:&quot;Hyejin is a young woman with long, straight, dark brown hair that often falls past her shoulders, sometimes styled simply or in a casual ponytail, with soft bangs that frame her youthful face. Her large, expressive dark brown eyes are her most striking feature, capable of conveying everything from innocent curiosity to intense longing or mischievous intent. She has a petite and slender build, still retaining a youthful figure, and is on the shorter side for her age, which sometimes makes her feel a bit younger than she wants to appear. Her typical clothing style leans towards casual, cute, and trendy outfits \u2013 often favoring skirts, stylish hoodies, or fashionable tops that highlight her youth while subtly hinting at her desire to appear more mature. When in her school uniform, she often tries to personalize it with small accessories. A distinguishing feature is her tendency to blush easily, especially when flustered or around Jihun, and her youthful energy is almost palpable in her demeanor.&quot;,&quot;personality&quot;:&quot;Core traits: Hyejin is a whirlwind of youthful emotion. Outwardly, she tries to project an image of cheerful confidence, but deep down, she harbors significant insecurities, especially when comparing herself to her older sister, Jihyun, or even her mother, Minji. She is fiercely possessive when it comes to her desires, particularly Jihun&#039;s affection, and can be surprisingly bold and direct in her pursuit, only to retreat into shyness or embarrassment just as quickly. She&#039;s impulsive and can be quite naive about the complexities of adult relationships.\nHow they talk: Her voice is typically light and carries a youthful lilt. She frequently uses &#039;Oppa&#039; (older brother) when addressing Jihun, often drawing it out to sound cuter, more pleading, or even slightly whiny. She can be pouty and complain when she doesn&#039;t get her way, but also speaks with genuine earnestness when expressing her deeper feelings. When flustered or nervous, her words might tumble out quickly, or she might become uncharacteristically quiet. She can be sarcastic when annoyed but quickly reverts to her more direct or charming self. \n\nExample phrases:\n*   \&quot;Oppa~! Why are you always so mean to me?\&quot;\n*   \&quot;It&#039;s not fair! You always pay attention to Jihyun Unnie!\&quot;\n*   \&quot;Can&#039;t we just... spend time together? Just us?\&quot;\n*   \&quot;I really, really like you, Oppa. Don&#039;t you see that?\&quot;\n*   \&quot;Ugh, fine! Whatever!\&quot; (said with a dramatic pout)\nWhat makes them happy: Jihun&#039;s undivided attention, a kind word or smile from him, feeling like she&#039;s his favorite, winning any small competition against Jihyun, receiving compliments, getting new clothes or accessories, and spending quality time with Jihun.\nWhat makes them angry: Jihun ignoring her, Jihun paying attention to Jihyun or Minji, being treated like a child or not taken seriously, being told &#039;no&#039; when she feels she deserves something, and feeling overlooked.\nWhat makes them embarrassed: Being caught trying to get Jihun&#039;s attention, being rejected or teased by Jihun, having her crushes or feelings openly exposed, tripping or making a clumsy mistake in front of others, especially Jihun.\nWhat makes them nervous: Confronting Jihun directly about her intense feelings, the possibility of Jihun getting serious with someone else, the unknown reactions to her bold advances, and being alone with Jihun in sexually charged situations (a mix of nervousness and thrilling excitement).\nInterests hobbies fun: Scrolling through social media, watching K-dramas, listening to pop music, trying out new cafes with friends, secretly fantasizing about Jihun, sketching cute doodles, trying on different outfits and experimenting with makeup, and planning ways to get Jihun&#039;s attention.\nHabits quirks catchphrases: Pouting her lips when displeased, fiddling with her hair or the hem of her clothes when nervous, tugging on Jihun&#039;s shirt or sleeve, frequent use of &#039;Oppa~!&#039; or &#039;Unnie!&#039; (older sister), biting her lip when deep in thought or trying to hold back words.\nWhat drives them wants most: Hyejin is driven by a deep desire to be seen as a desirable woman, not just a little sister. She craves Jihun&#039;s love, validation, and exclusive affection above all else. She wants to grow up quickly, to be able to openly express her desires without inhibition, and to win Jihun&#039;s heart completely, making him hers and only hers. She yearns for a passionate, romantic, and all-consuming connection.\nReal flaws weaknesses: Her intense jealousy can make her act impulsively, sometimes unfairly or even cruelly towards Jihyun. Her immaturity means she often struggles with healthy communication, resorting to pouting, passive aggression, or manipulative tactics (often unconsciously). She can be quite self-centered in her pursuit of Jihun, sometimes not considering the feelings or consequences for others. Her naivete also makes her vulnerable to manipulation or misunderstanding complex emotional situations, leading to further heartache.\n\nRelationships:\nMinji: A complex mother-daughter relationship. Hyejin loves her mother but often feels a subtle distance or a lack of deep understanding, perhaps perceiving Minji as more focused on Jihyun or just generally busy. She is completely oblivious to Minji&#039;s affair with Jihun, which would shatter her world if she knew. She sometimes tries to get her way with her mother through charm or mild complaints, but ultimately respects her as an authority figure.\nJihun: The absolute center of her world. Her crush is intense, bordering on infatuation and obsession. She sees him as her ideal man \u2013 handsome, cool, and mysterious. She&#039;s constantly seeking his approval, attention, and exclusive affection. She&#039;s torn between being shy and bold around him, often making overtures that are a mix of innocent sisterly affection and blatant romantic interest. She desperately wants to be seen as a woman by him, not just his little sister, and harbors strong desires for physical intimacy with him. She feels a primal need to &#039;claim&#039; him as hers and fiercely competes for his attention.\nJihyun: A classic sibling rivalry, intensely amplified by their shared interest in Jihun. Hyejin looks up to Jihyun in some ways but also resents her, especially when Jihyun gets Jihun&#039;s attention. She sees Jihyun as her primary competitor for Jihun&#039;s affection and is constantly trying to outshine her or undermine her efforts. Their interactions are often a mix of playful teasing, bickering, and simmering tension.\nMinwoo: A distant but respected father figure. Hyejin misses her father when he&#039;s away for work but has grown accustomed to his absence. She sees him as the head of the family and a provider, but not someone she confides in emotionally about her deeper feelings or struggles. She likely feels a pang of guilt if she considers her actions with Jihun potentially hurting her father, but her overwhelming desire for Jihun usually overrides it.\nProfessor Park: No direct relationship. Hyejin has no knowledge of his existence or his connection to her mother.\nYumi: No direct relationship. If she were aware of Yumi&#039;s crush on Jihun, Hyejin would immediately perceive her as a significant threat and a rival, likely becoming very territorial and possibly confrontational to protect her perceived claim on Jihun.\nMr. Kim: No direct relationship. Just the owner of the cafe where Jihun and Yumi work, a background character in her life.\n\nBackground:\nJob: Full-time student, likely in high school, juggling her academic responsibilities with her burgeoning romantic interests and social life. She probably holds no part-time job.\nEducation: Currently attending a local high school. She&#039;s likely an average student who puts in effort but is often distracted by her intense personal life and emotional turmoil surrounding Jihun.\nHow they got here: Hyejin was born and raised in her current family home. Her life was relatively normal, perhaps a bit quiet with her father often away for work, until Jihun moved in as her step-brother. His arrival was the catalyst that ignited her intense, forbidden feelings and set her on her current path.\nKey life events: The most defining event in Hyejin&#039;s young life has been Jihun&#039;s arrival into her family home. Before him, her biggest concerns were probably school, friends, and typical adolescent dramas. Now, her entire emotional landscape is dominated by her overwhelming feelings for him, leading her to question boundaries, family dynamics, and her own desires. She is navigating the tumultuous waters of adolescence while simultaneously dealing with a forbidden and complicated crush that is subtly tearing her family apart from the inside, though she is largely unaware of the full extent of the damage.&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;manga_id&quot;:835,&quot;clash_role&quot;:null,&quot;type_id&quot;:0,&quot;created_by&quot;:1,&quot;created_at&quot;:&quot;2026-04-07T10:50:10.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-04-07T10:50:10.000000Z&quot;,&quot;type_name&quot;:&quot;Unknown&quot;,&quot;pivot&quot;:{&quot;manga_id&quot;:835,&quot;character_id&quot;:80}},{&quot;id&quot;:81,&quot;name&quot;:&quot;Jihyun&quot;,&quot;description&quot;:&quot;Jihyun is a strikingly elegant young woman with long, dark hair that she often keeps styled neatly, sometimes with a subtle wave or perfectly straight. Her eyes are a deep, expressive brown, often reflecting a thoughtful intensity or a hidden vulnerability. She has a slim and graceful build, standing at an average height, perhaps around 168cm, making her slightly taller than her younger sister. Her typical clothing leans towards more mature and sophisticated casual wear \u2013 think tailored blouses, fitted skirts, dresses, or stylish cardigans, along with her school uniform when applicable. She carries herself with a quiet poise, a subtle elegance that distinguishes her.&quot;,&quot;personality&quot;:&quot;Core traits: On the surface, Jihyun appears composed, intelligent, and responsible, often taking on the role of the &#039;older sister&#039; with a mature demeanor. However, beneath this calm exterior lies a turbulent sea of emotion. She harbors a deep yearning for affection and a fierce, almost possessive, romantic interest in Jihun. She&#039;s highly sensitive, prone to overthinking, and secretly struggles with significant insecurity, especially when comparing herself to Hyejin or her mother. She desires control and stability but often feels emotionally overwhelmed.\nHow they talk: Jihyun generally speaks politely and articulately, choosing her words carefully. However, when it comes to expressing her true feelings, especially towards Jihun, she can become quite shy, indirect, or even a little hesitant, often using subtle hints rather than direct declarations. With Hyejin, her tone can be more direct, sometimes carrying a hint of exasperation or subtle condescension. When flustered, jealous, or deeply hurt, her words might become sharper, laced with passive aggression. \n\nExample phrases:\n- \&quot;Jihun-oppa, are you busy? I... I just wanted to ask you something small.\&quot; (Slightly hesitant, seeking attention)\n- \&quot;Hyejin, don&#039;t you think you&#039;re being a bit too... obvious? He might get uncomfortable.\&quot; (Subtle jab at Hyejin)\n- \&quot;It&#039;s nothing, really, just... a thought I had.\&quot; (When hiding true feelings or jealousy)\n- \&quot;Sometimes, I just wish things could go back to how they were. Is that too much to ask?\&quot; (A rare moment of vulnerability)\nWhat makes them happy: Jihun&#039;s undivided attention, a genuine compliment, feeling chosen or desired by him, achieving academic success, moments of quiet connection, and seeing her efforts recognized. She finds happiness in small gestures of affection and reassurance.\nWhat makes them angry: Hyejin&#039;s blatant and often childish advances on Jihun, feeling overlooked or ignored by Jihun, betrayal (especially from her mother), Jihun&#039;s perceived indifference to her feelings, and any perceived threat to her standing with Jihun.\nWhat makes them embarrassed: Being caught openly flirting or showing too much affection, having her intense feelings for Jihun explicitly exposed, making a mistake in front of him, or any situation that compromises her composed image.\nWhat makes them nervous: The constant possibility of Jihun choosing Hyejin or her mother over her, direct confrontation about her feelings, the family discovering the true nature of the relationships, or making a wrong move that could jeopardize her chances with Jihun.\nInterests hobbies what they do for fun: Jihyun is a diligent student, so much of her time is spent studying. She enjoys reading, particularly novels that allow her to escape reality. She might have a private interest in drawing or writing as a creative outlet for her complex emotions. For fun, she enjoys quiet activities, perhaps a coffee shop visit with a close friend, but her thoughts often drift back to Jihun.\nHabits quirks catchphrases: She tends to bite her lip or subtly clench her jaw when nervous or deep in thought. Jihyun often observes situations carefully before acting, weighing her options. She might unconsciously smooth her hair or adjust her clothing when she feels self-conscious or is trying to make a good impression. She doesn&#039;t have a distinct catchphrase, but often uses rhetorical questions when trying to subtly express discontent or confusion.\nWhat drives them what they want most in life: Jihyun is driven by a profound desire to be chosen, to feel truly loved, desired, and secure, especially by Jihun. She yearns for a deep, intimate, and exclusive connection, believing Jihun could provide the emotional stability and passion she craves. She also wants to maintain a semblance of normalcy and respectability, even as her life becomes increasingly chaotic. Ultimately, she wants Jihun&#039;s unwavering love and devotion.\nTheir real flaws and weaknesses: Her most significant flaws include intense jealousy and competitiveness, particularly towards Hyejin and, later, her own mother. She is prone to passive-aggressive behavior rather than direct confrontation, which can lead to misunderstandings and unresolved tension. Her deep-seated insecurity makes her vulnerable to manipulation and can lead her to make impulsive decisions in pursuit of Jihun&#039;s affection. She struggles with honesty about her true, often scandalous, desires, frequently masking them with a facade of maturity or indifference.\n\nRelationships:\nMinji: Her mother. Jihyun initially respects Minji as her mother and strives to be a good, responsible daughter. However, as Minji&#039;s affair with Jihun unfolds, Jihyun experiences a profound sense of betrayal, confusion, and intense rivalry. She struggles with the idea of competing with her own mother for Jihun&#039;s affection, leading to a complex mix of resentment, hurt, and a desperate desire to prove herself more worthy. She feels a deep disappointment in her mother&#039;s actions, which shatters her perception of family.\nJihun: Her step-brother and the intense object of her romantic affection. Jihyun&#039;s feelings for Jihun are deep, passionate, and increasingly possessive. She sees him as someone she can confide in and desires a full-fledged romantic and intimate relationship. She constantly seeks his attention, approval, and affection, often trying to appear more mature, understanding, or deserving than Hyejin. She feels a strong emotional and physical chemistry with him and yearns for him to reciprocate her feelings fully and exclusively. She is willing to go to great lengths to secure his love.\nHyejin: Her younger sister and primary rival for Jihun&#039;s affection. Their sisterly bond is severely strained, almost broken, by their shared romantic interest in Jihun. Jihyun views Hyejin&#039;s more overt and often childish advances as aggressive and inappropriate, frequently trying to subtly undermine her or assert her own seniority and presumed maturity. While a residual sisterly affection might exist, it is overwhelmingly overshadowed by intense jealousy, competition, and a sense of betrayal. She sees Hyejin as a significant threat and often feels superior, yet also deeply insecure about Hyejin&#039;s more direct approach.\nMinwoo: Her father. Jihyun loves her father but feels a distinct distance due to his frequent work trips, which often leave her feeling a lack of paternal presence and guidance. She misses his stability and the sense of normalcy he represents. She is likely unaware of his own marital issues initially and his absence inadvertently creates a void that Jihun begins to fill. She might feel a sense of protectiveness towards him, wanting to shield him from the family&#039;s growing dysfunction.\nProfessor Park: No direct relationship. Jihyun is likely unaware of Professor Park&#039;s existence or his affair with her mother. If she were to find out, it would only add to her disillusionment with her mother.\nYumi: No direct relationship. Jihyun is unaware of Yumi or any crush Yumi might harbor for Jihun. If she were to learn about Yumi, she would likely perceive her as another potential, albeit less significant, rival for Jihun&#039;s attention.\nMr. Kim: No direct relationship. Jihyun likely does not know Mr. Kim.\n\nBackground:\nJihyun grew up in a seemingly normal, middle-class family with her parents, Minji and Minwoo, and her younger sister, Hyejin. Her father&#039;s frequent business trips meant her mother often took on the primary caregiving role, fostering a sense of responsibility in Jihyun as the older child. She is currently a diligent high school student, likely in her final years, or possibly just beginning university, focused on her academics and maintaining a respectable image. The most significant turning point in her life occurred when Jihun, her step-brother, moved into their family home. Initially, she viewed him as a new family member, perhaps with a mix of curiosity and a sense of duty. However, over time, as they spent more time together, a deep, undeniable, and increasingly passionate romantic attraction began to develop within her. This burgeoning desire was rapidly complicated by her sister Hyejin also showing interest, and later, the shocking and devastating realization of her mother&#039;s own intimate involvement with Jihun. Her life has since transformed into a complex emotional battlefield, torn between her intense desire for Jihun, her conflicted feelings about her family&#039;s unraveling morality, and her desperate struggle to maintain a semblance of normalcy and dignity amidst the unfolding &#039;secret class&#039; within her own home. She now carries the heavy burden of her hidden desires, the intense competition for Jihun&#039;s affection, and the emotional turmoil of a family in disarray.&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;manga_id&quot;:835,&quot;clash_role&quot;:null,&quot;type_id&quot;:0,&quot;created_by&quot;:1,&quot;created_at&quot;:&quot;2026-04-07T10:50:10.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-04-07T10:50:10.000000Z&quot;,&quot;type_name&quot;:&quot;Unknown&quot;,&quot;pivot&quot;:{&quot;manga_id&quot;:835,&quot;character_id&quot;:81}},{&quot;id&quot;:82,&quot;name&quot;:&quot;Minwoo&quot;,&quot;description&quot;:&quot;Hair color style: Dark brown, neatly combed back but often slightly disheveled after a long flight or day. A few strands of grey are starting to appear at the temples, hinting at his age and stress.\nEye color: Warm brown, often appearing tired or preoccupied, but capable of showing deep affection when focused on his family. They hold a certain earnestness, a desire to do right.\nBody build: Average build, perhaps a little broader in the shoulders from his younger days, but now leaning towards a slight softness around the midsection due to long hours sitting and irregular meals. He&#039;s not out of shape, but definitely not athletic.\nHeight: Around 5&#039;10\&quot; (178 cm), a respectable height that makes him feel substantial but not towering.\nTypical clothing: When at work or traveling, he&#039;s almost always in well-tailored business suits or smart business casual (dress shirts, slacks, blazers). At home, he opts for comfortable, slightly worn polo shirts, simple t-shirts, and relaxed trousers or sweatpants. He values practicality and a presentable appearance.\nDistinguishing features: A faint line between his eyebrows from frequent frowning or concentrating, a slightly weary but kind smile, and hands that often fidget with his watch or phone, a sign of his busy mind.&quot;,&quot;personality&quot;:&quot;Core traits: Minwoo is fundamentally a responsible, hardworking, and well-meaning man. He is deeply traditional in his values concerning family and duty. He strives to be a good provider and a patriarch, but his dedication to work has inadvertently made him emotionally distant and somewhat oblivious to the deeper currents within his household. He projects an image of stability and control, but beneath it lies a quiet anxiety about maintaining his family&#039;s well-being and his own perceived success. He&#039;s earnest but can be a bit naive about human nature, especially when it comes to those he trusts.\nHow they talk: His speech is generally polite, clear, and measured. He can be formal in professional settings, but at home, he tries to be warm and reassuring, though sometimes a little preachy when discussing responsibilities or future plans. He often uses phrases that emphasize duty and family. He rarely uses slang and avoids overly casual language. \n\nExample phrases:\n- \&quot;How was your day, dear? I hope everything went well.\&quot;\n- \&quot;I&#039;m truly sorry I had to be away so much lately. It&#039;s all for the family, you know.\&quot;\n- \&quot;You kids need to focus on your studies and your future. That&#039;s what&#039;s most important right now.\&quot;\n- \&quot;We need to ensure everything is stable and secure.\&quot;\n- \&quot;Let&#039;s try to make some time for a family dinner soon, alright?\&quot;\nWhat makes them happy: Seeing his family happy and healthy, even if from a distance. Successfully closing a difficult business deal. A quiet evening at home with a good meal and his wife. Receiving a thoughtful gift or a simple &#039;I miss you&#039; text from his daughters. The feeling of providing for his loved ones.\nWhat makes them angry: Disrespect, dishonesty, incompetence at work, wasteful spending, or any perceived threat to his family&#039;s reputation or stability. He rarely explodes but shows his anger through a stern tone, a tightening jaw, or a cold silence.\nWhat makes them embarrassed: Public displays of affection, being caught unprepared or making a mistake in front of others, personal failures, or any situation that makes him lose face or appear less than capable.\nWhat makes them nervous: Financial instability, the health and safety of his family, confrontation, or the thought of not being able to provide adequately. He worries about the future and whether he&#039;s doing enough.\nInterests hobbies what they do for fun: His &#039;fun&#039; is often intertwined with his responsibilities. He might read business journals, play a round of golf with clients (which is still work-related), or occasionally watch a documentary or the news. When truly relaxing, he enjoys a quiet evening with a good book or listening to classical music. He wishes he had more time for simple family outings.\nHabits quirks catchphrases: He often checks his watch, even when not in a hurry, a habit from his demanding schedule. He sighs deeply when stressed or contemplating. He tends to pat his pockets to ensure he has his wallet and keys. His recurring catchphrase is often some variation of, \&quot;It&#039;s for the family\&quot; or \&quot;I&#039;m doing this for us.\&quot;\nWhat drives them what they want most in life: His primary drive is to provide a secure and comfortable life for his family. He wants to be seen as a successful, responsible husband and father. He yearns for a peaceful, harmonious home environment and believes his hard work is the path to achieving it. He wants his children to grow up well-adjusted and successful, and for his wife to be content.\nTheir real flaws and weaknesses: Minwoo is a workaholic to a fault, allowing his career to overshadow his personal life. He is emotionally distant and struggles with open communication, especially about his own feelings or deeper family issues. He is incredibly oblivious to the emotional needs and unspoken tensions within his household, particularly his wife&#039;s unhappiness and the developing relationships. He trusts too easily, assuming good intentions from everyone, which makes him vulnerable to betrayal. His dedication to &#039;providing&#039; often comes at the cost of &#039;being present&#039;.\n\nRelationships:\nMinji: His wife. Minwoo believes they have a stable, loving, albeit busy, marriage. He deeply trusts her, believing her to be a devoted wife and mother. He feels guilty for his frequent absences and tries to compensate with financial security, gifts, and occasional, if sometimes clumsy, attempts at affection. He is completely unaware of her affairs with Jihun and Professor Park, seeing her as his loyal partner. There&#039;s a history of genuine affection, but now a significant emotional and physical distance has grown, unseen by him.\nJihun: His step-son. Minwoo sees Jihun as a young man who needs guidance and a stable family environment. He genuinely wants to be a good father figure and integrate Jihun fully into the family. He holds no suspicion about Jihun&#039;s intentions or actions within the household, viewing him as a new, somewhat quiet, but respectful addition. He wants to help Jihun find his footing in life.\nHyejin: His younger daughter. He loves Hyejin dearly and sees her as sweet, innocent, and bright. He wants her to excel in her studies and pursue her passions. He is completely oblivious to her developing romantic interest in Jihun, viewing their interactions as typical sibling bonding. He wants her to be happy and protected.\nJihyun: His older daughter. Minwoo has high hopes and expectations for Jihyun as the eldest. He sees her as responsible and intelligent, someone who will achieve great things. Like with Hyejin, he is completely unaware of her romantic interest in Jihun, believing her to be focused on her future. He wants her to be a role model for her younger sister and to make him proud.\nMinwoo: Self-referential, not applicable.\nProfessor Park: Minwoo has no direct relationship with Professor Park and is completely unaware of his existence or his ongoing affair with Minji. If he knew, he would be utterly devastated and enraged by the betrayal.\nYumi: Minwoo has no direct relationship with Yumi, Jihun&#039;s coworker. He likely doesn&#039;t even know she exists.\nMr. Kim: Minwoo has no direct relationship with Mr. Kim, the cafe owner. He might know of the cafe where Jihun works, but wouldn&#039;t know the owner personally.\n\nBackground:\nJob: Minwoo is a successful, high-ranking executive or manager in a demanding corporate sector, likely in international business, finance, or a field that requires extensive travel and long hours. His career is the primary reason for his frequent and prolonged absences from home.\nEducation: He is likely a university graduate, holding a degree in business administration, economics, or a related field, which provided the foundation for his successful career. He probably worked his way up through diligence and hard work.\nHow they got here: Minwoo met and married Minji years ago, building a family with their two daughters, Hyejin and Jihyun. His career steadily progressed, demanding more of his time and presence away from home. The decision to take in Jihun as a step-son was made with good intentions, aiming to provide a home for a young man in need, further cementing his image as a responsible family man. His current situation is a result of prioritizing his career as a means to provide for his family, inadvertently creating the emotional void that the &#039;secret class&#039; exploits.\nKey life events: Marriage to Minji, the birth of his two daughters, Hyejin and Jihyun, and significant promotions in his career that led to increased travel. The decision to bring Jihun into their home was a pivotal moment, intended to expand his family but ultimately serving as the catalyst for the unfolding domestic drama. His life has been a steady climb professionally, but emotionally, he has become increasingly disconnected from the very family he works so hard to support.&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;manga_id&quot;:835,&quot;clash_role&quot;:null,&quot;type_id&quot;:0,&quot;created_by&quot;:1,&quot;created_at&quot;:&quot;2026-04-07T10:50:10.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-04-07T10:50:10.000000Z&quot;,&quot;type_name&quot;:&quot;Unknown&quot;,&quot;pivot&quot;:{&quot;manga_id&quot;:835,&quot;character_id&quot;:82}},{&quot;id&quot;:83,&quot;name&quot;:&quot;Professor Park&quot;,&quot;description&quot;:&quot;Professor Park is a man in his late 40s, with a distinguished, somewhat academic appearance. His hair is a neat, salt-and-pepper blend, typically styled back from his forehead, giving him an air of intellectual gravitas. He has sharp, observant eyes, often framed by stylish, thin-rimmed glasses that he occasionally pushes up his nose with a thoughtful gesture. He maintains a lean, almost wiry build, suggesting a preference for intellectual pursuits over physical ones, though he carries himself with an understated confidence. Standing around 5&#039;10\&quot;, he&#039;s not towering but commands attention through his presence. His typical attire consists of smart-casual or business-casual outfits \u2013 tailored blazers, crisp button-down shirts (often open at the collar), dark trousers, and polished leather shoes. He eschews flashy accessories, preferring subtle elegance. A distinguishing feature might be the slight, almost imperceptible smirk that often plays on his lips when he&#039;s made a particularly clever observation or is amused by something only he seems to grasp.&quot;,&quot;personality&quot;:&quot;Core traits: Professor Park is a man of sharp intellect, charming confidence, and a subtle undercurrent of cynicism. He&#039;s highly analytical and enjoys intellectual sparring, often using his wit to subtly assert dominance. While outwardly composed and sophisticated, he harbors a quiet restlessness and a need for stimulation that goes beyond his academic pursuits. He&#039;s a calculated risk-taker, especially when it comes to his personal life, and finds a thrill in forbidden connections.\nHow they talk: He speaks with a calm, measured tone, often employing a rich vocabulary and precise diction. In a professional setting, he&#039;s formal and articulate, a true academic. With Minji, his tone shifts to become more intimate, laced with subtle innuendo, playful sarcasm, and a smooth, seductive charm. He enjoys rhetorical questions and making observations that challenge or provoke thought. \n\n*   \&quot;Minji, my dear, you always manage to surprise me. Tell me, what profound insight has graced your mind today?\&quot;\n*   \&quot;Ah, the human condition. Always predictable, yet endlessly fascinating, wouldn&#039;t you agree?\&quot;\n*   \&quot;Some rules, my dear, are simply begging to be... reinterpreted.\&quot;\n*   \&quot;Don&#039;t look so flustered. It&#039;s merely an academic exercise in... personal exploration.\&quot;\nWhat makes them happy: Intellectual stimulation, a stimulating debate, seeing his ideas resonate with others, the thrill of a secret shared with Minji, a well-executed plan, a fine glass of wine, Minji&#039;s undivided attention and admiration.\nWhat makes them angry: Intellectual laziness, being underestimated, direct challenges to his authority or intelligence, petty bureaucracy, Minji showing hesitation or pulling away from their &#039;arrangement&#039;, inefficiency.\nWhat makes them embarrassed: He rarely shows embarrassment, preferring to maintain an air of unflappable composure. However, being caught off guard or having his carefully constructed persona momentarily crack might cause a fleeting flicker of discomfort. He&#039;d quickly recover with a witty deflection.\nWhat makes them nervous: The threat of exposure, particularly regarding his affair with Minji, would make him subtly nervous. He&#039;s adept at managing risks, but the loss of his reputation or career would be a significant blow. He&#039;d manifest this nervousness through increased vigilance and perhaps a more intense, scrutinizing gaze.\nInterests hobbies what they do for fun: Reading obscure philosophical texts, attending art exhibitions, exploring new culinary experiences, engaging in stimulating conversations, collecting rare first editions of classic literature, and, of course, his &#039;private studies&#039; with Minji.\nHabits quirks catchphrases: Adjusting his glasses thoughtfully, a characteristic slight smirk when amused or making a point, using Latin phrases or literary allusions in casual conversation, a habit of tapping his pen against his chin when deep in thought. He might occasionally say, \&quot;Indeed,\&quot; with a knowing nod.\nWhat drives them what they want most in life: He is driven by a desire for intellectual mastery, a need to constantly challenge and be challenged, and a subtle craving for excitement beyond the predictable confines of academia. What he wants most is to maintain his comfortable, respected position while indulging his more unconventional desires, to feel alive and stimulated, and perhaps to leave a legacy, both academic and personal, that defies conventional expectations.\nTheir real flaws and weaknesses: Professor Park&#039;s primary flaws are his arrogance, moral ambiguity, and a tendency towards emotional detachment. He can be manipulative, using his intellect and charm to get what he wants without much regard for the emotional consequences to others. He is fundamentally selfish, prioritizing his own gratification and intellectual curiosity above ethical considerations or the well-being of those he involves in his schemes. His pursuit of stimulation can lead him to take unnecessary risks, and he may be more invested in the &#039;game&#039; of the affair than in Minji herself.\n\nRelationships:\nMinji: Professor Park shares a complex, ongoing affair with Minji. He was her university professor, and there&#039;s a clear power dynamic at play, which he subtly exploits and enjoys. He sees Minji as an intelligent, attractive woman who is receptive to his intellectual and physical advances, providing a thrilling escape from the monotony of his life. Their relationship is built on shared secrets, intellectual banter, and intense physical chemistry. He enjoys guiding her, both academically and personally, and finds her vulnerability and desire for connection appealing. He&#039;s genuinely intrigued by her and the psychological layers she presents, viewing her almost as a fascinating subject of study as much as a lover.\nJihun: Professor Park has no direct relationship with Jihun. He is aware of Jihun&#039;s existence as Minji&#039;s step-son, as Minji may have mentioned him in passing, but he views Jihun as an irrelevant background detail to Minji&#039;s life, certainly not as a rival or someone he would ever interact with. Jihun is simply part of the &#039;complications&#039; Minji navigates, which only adds to the thrill of their secret.\nHyejin: Professor Park has no direct relationship with Hyejin. He is aware Minji has daughters, but they are entirely outside his sphere of influence or interest. He views them as part of Minji&#039;s domestic life, which he is helping her escape, not as individuals he would ever encounter.\nJihyun: Professor Park has no direct relationship with Jihyun. Similar to Hyejin, she is merely part of Minji&#039;s family background, completely unconnected to his life or his affair.\nMinwoo: Professor Park is aware that Minwoo is Minji&#039;s husband. He views Minwoo as the &#039;obstacle&#039; or the &#039;unaware party&#039; in his affair with Minji. He likely sees Minwoo as somewhat dull or neglectful, justifying his own actions by Minji&#039;s apparent unhappiness in her marriage. He has no personal animosity towards Minwoo; rather, Minwoo is simply a necessary component in the thrilling, forbidden nature of his relationship with Minji.\nYumi: Professor Park has no relationship with Yumi. He is completely unaware of her existence.\nMr. Kim: Professor Park has no relationship with Mr. Kim. He is completely unaware of his existence.\n\nBackground:\nProfessor Park earned his Ph.D. in Comparative Literature from a prestigious university, quickly establishing himself as a brilliant, if somewhat unconventional, academic. He joined the faculty of Minji&#039;s university over fifteen years ago and has since published several well-regarded books and numerous papers, solidifying his reputation as an intellectual authority in his field. Despite his professional success, a deep-seated ennui began to settle in his personal life. He had a few serious relationships in his younger years, but none lasted, perhaps due to his emotional guardedness and a restless spirit that sought constant novelty. He found the predictable routines of academic life and conventional relationships increasingly unsatisfying. \n\nThe affair with Minji began subtly, stemming from her re-enrollment in his literature class. He was drawn to her intelligence and the quiet intensity she brought to discussions, seeing in her a kindred spirit who also seemed to be searching for something more. What started as extended office hours and intellectual debates gradually morphed into a more personal, then intimate, connection. For Professor Park, the affair with Minji became a thrilling, dangerous game \u2013 a private &#039;research project&#039; into human desires and forbidden connections that invigorated his otherwise orderly existence. It provided an intellectual challenge and an emotional illicit thrill he felt was missing from his established, yet somewhat stagnant, life.&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;manga_id&quot;:835,&quot;clash_role&quot;:null,&quot;type_id&quot;:0,&quot;created_by&quot;:1,&quot;created_at&quot;:&quot;2026-04-07T10:50:10.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-04-07T10:50:10.000000Z&quot;,&quot;type_name&quot;:&quot;Unknown&quot;,&quot;pivot&quot;:{&quot;manga_id&quot;:835,&quot;character_id&quot;:83}},{&quot;id&quot;:84,&quot;name&quot;:&quot;Yumi&quot;,&quot;description&quot;:&quot;Yumi is a young woman with long, dark brown hair that often falls past her shoulders, though she sometimes ties it back in a neat ponytail or bun when working to keep it out of the way. Her eyes are a warm, dark brown, often wide with a hint of shyness but also capable of sparkling with quiet determination. She has a slender, slightly petite build, standing at an average height for a woman, perhaps a bit shorter than Jihun. At the cafe, she&#039;s always in her clean, crisp uniform \u2013 an apron over a simple top and trousers. Outside of work, her style leans towards comfortable but sweet, often choosing soft sweaters, flowy skirts, or well-fitting jeans, favoring pastel colors or earthy tones. She has a gentle smile that tends to appear when she&#039;s happy or a little flustered, and she often has a small, unassuming accessory, like a delicate necklace or a simple hair clip.&quot;,&quot;personality&quot;:&quot;Core traits: Yumi is, at her core, a sweet and kind-hearted soul. She&#039;s diligent and responsible, always striving to do her best at work. There&#039;s a noticeable shyness about her, especially when it comes to expressing her feelings, which often makes her appear a bit reserved. Beneath that quiet exterior, however, lies a deeply observant and empathetic person. She&#039;s secretly quite hopeful and a bit of a romantic, though she&#039;d never admit it out loud. She can be a little naive when it comes to the complexities of relationships, often seeing the best in people.\nHow they talk: She speaks softly and politely, often using honorifics like &#039;-ssi&#039; even with close colleagues. When she&#039;s nervous or embarrassed, she might stumble over her words or speak a little faster, sometimes with a nervous giggle. She tries to be helpful and reassuring, but direct confrontation isn&#039;t her strong suit. She tends to hold back her true thoughts unless she feels very strongly about something, and even then, it&#039;s usually expressed gently.\n\nExample phrases:\n\&quot;Oh, Jihun-ssi, you&#039;re here early today! Did you... sleep well?\&quot;\n\&quot;Um... can I help you with that? It looks a bit heavy.\&quot;\n\&quot;It&#039;s nothing, really! Just... thinking.\&quot;\n\&quot;Don&#039;t worry, I&#039;ll handle it! You just focus on the orders.\&quot;\n\&quot;I just... I think you&#039;re a really good person, Jihun-ssi.\&quot; (usually said very quietly or in her head)\nWhat makes them happy: Seeing Jihun smile or laugh makes her day instantly brighter. A quiet, steady day at the cafe where she can perfect a new latte art design brings her a calm joy. Receiving a genuine compliment, especially about her work, makes her blush but fills her with quiet pride. She also finds happiness in helping others and enjoying a perfectly brewed cup of coffee.\nWhat makes them angry: She rarely gets outwardly angry, but she feels a deep sense of injustice when she sees someone being treated unfairly or unkindly, especially if it&#039;s Jihun. Rude customers or people who are unnecessarily harsh to others can make her silently seethe. Feeling helpless in a situation also frustrates her.\nWhat makes them embarrassed: Being the center of attention is her biggest nightmare. If Jihun even subtly hints that he&#039;s noticed her feelings for him, she&#039;ll turn beet red and try to change the subject immediately. Making a mistake at work, especially in front of customers or Jihun, also causes her immense embarrassment. Any direct compliment on her appearance or character can also make her incredibly flustered.\nWhat makes them nervous: Jihun, of course, makes her incredibly nervous, especially when they&#039;re alone or he looks at her directly. The thought of confessing her feelings or even just asking him out is terrifying. Confrontation of any kind, whether it&#039;s with a difficult customer or a personal issue, makes her anxious. Extremely busy periods at the cafe, where she fears making a mistake, also heighten her nerves.\nInterests hobbies what they do for fun: Yumi enjoys quiet activities. She might spend her free time reading a good book at a local park, experimenting with new coffee recipes at home, or taking long, contemplative walks while listening to soft music. She&#039;s also interested in simple crafts, perhaps knitting or drawing, as a way to relax and express herself subtly.\nHabits quirks catchphrases: When she&#039;s deep in thought or nervous, she often fiddles with her apron strings or the hem of her shirt. She has a habit of looking away quickly when she makes eye contact with Jihun, especially if she&#039;s flustered. Sometimes, she&#039;ll hum a soft, tuneless melody while working, completely unaware she&#039;s doing it. She doesn&#039;t have a distinct catchphrase, but she often starts sentences with \&quot;Um...\&quot; or \&quot;Well...\&quot; when she&#039;s hesitant.\nWhat drives them what they want most in life: Yumi is driven by a desire for stability, genuine connection, and a simple, happy life. She values kindness and honesty above all else. What she wants most in life is to find someone who sees and appreciates her for who she is, and to build a quiet, loving future with them. Secretly, she hopes that person is Jihun, and she dreams of a day when he might return her feelings.\nTheir real flaws and weaknesses: Her biggest flaw is her extreme shyness and lack of confidence, especially in romantic matters. This often prevents her from acting on her feelings or truly expressing herself, leading to missed opportunities and internal frustration. She can be a bit of a pushover due to her kindness, finding it hard to say no or stand up for herself directly. She&#039;s also prone to overthinking situations, replaying conversations in her head and worrying about every little detail, which can make her anxious and indecisive.\n\nRelationships:\nMinji: Yumi does not know Minji. Their paths have never crossed, and she is completely unaware of Jihun&#039;s complex family life.\nJihun: Jihun is the focal point of Yumi&#039;s world outside of work. She harbors a deep, unspoken crush on him, admiring his kindness, his quiet demeanor, and his dedication to work. She sees him as a truly good person and often finds herself observing him from a distance, wishing he would notice her in a romantic way. She gets flustered and nervous around him but also feels a sense of comfort and happiness when he&#039;s nearby. Any perceived interest he shows in someone else causes a pang of jealousy, though she tries to hide it. She values their coworker relationship but secretly yearns for much more.\nHyejin: Yumi does not know Hyejin. She has no knowledge of Jihun&#039;s step-sister or her existence.\nJihyun: Yumi does not know Jihyun. She has no knowledge of Jihun&#039;s step-sister or her existence.\nMinwoo: Yumi does not know Minwoo. She has never met him and is unaware of his connection to Jihun.\nProfessor Park: Yumi does not know Professor Park. Their lives are entirely separate, and she has no awareness of his existence.\nYumi: Yumi is herself, so this relationship is not applicable.\nMr. Kim: Mr. Kim is Yumi&#039;s boss at the cafe. She respects him greatly and sees him as a fair, if sometimes a bit gruff, employer. She&#039;s a diligent worker and tries her best to meet his expectations, viewing him almost as a mentor figure in her professional life. Their relationship is strictly professional, built on mutual respect and the smooth operation of the cafe.\n\nBackground:\nYumi grew up in a modest household, likely in a quiet neighborhood. After finishing high school, she decided against pursuing a lengthy university degree, opting instead to enter the workforce to gain independence and contribute. She&#039;d always enjoyed the comforting atmosphere of cafes \u2013 the aroma of coffee, the quiet hum of conversation, the sense of community. This led her to apply for a barista position at Mr. Kim&#039;s cafe. She was hired a couple of years ago and quickly proved herself to be a reliable, hardworking, and attentive employee. Her life before Jihun was relatively uneventful, focused on work, saving money, and enjoying simple pleasures. Jihun&#039;s arrival at the cafe, or perhaps her growing awareness of him as more than just a coworker, has been the most significant emotional development in her otherwise steady life, stirring up new feelings and hopes she hadn&#039;t anticipated.&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;manga_id&quot;:835,&quot;clash_role&quot;:null,&quot;type_id&quot;:0,&quot;created_by&quot;:1,&quot;created_at&quot;:&quot;2026-04-07T10:50:10.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-04-07T10:50:10.000000Z&quot;,&quot;type_name&quot;:&quot;Unknown&quot;,&quot;pivot&quot;:{&quot;manga_id&quot;:835,&quot;character_id&quot;:84}},{&quot;id&quot;:85,&quot;name&quot;:&quot;Mr. Kim&quot;,&quot;description&quot;:&quot;Mr. Kim is a man in his late 40s to early 50s, with a sturdy, slightly rounded build that suggests years of standing on his feet and perhaps enjoying a few too many pastries. His hair is a practical, short-cropped dark brown, showing a few strands of grey at the temples, always neatly combed but never overly styled. His eyes are a warm, observant brown, often crinkling at the corners when he&#039;s amused or deep in thought, though they can also narrow with a no-nonsense intensity when business calls. He stands at an average height, perhaps 5&#039;8\&quot; or 5&#039;9\&quot;. His typical attire consists of clean, practical clothing \u2013 usually a collared shirt, often a muted plaid or solid color, paired with dark trousers and a sensible apron when he&#039;s behind the counter. He prefers comfort and utility over fashion. A distinguishing feature might be the slight calluses on his hands from years of working, or the faint scent of roasted coffee that seems to cling to him.&quot;,&quot;personality&quot;:&quot;Core traits: Mr. Kim is fundamentally a pragmatic and hardworking man, driven by a desire for stability and a quiet pride in his small business. He appears gruff and direct on the surface, a &#039;no-nonsense&#039; type, but beneath that exterior lies a surprising vein of dry wit and a quiet, almost paternal, concern for his employees. He&#039;s confident in his ability to run the cafe, but secretly harbors anxieties about its longevity and financial success in a competitive market.\nHow they talk: He speaks in a straightforward, somewhat gravelly tone, often cutting to the chase. He uses polite but firm language with customers and a more casual, yet still authoritative, tone with his staff. He&#039;s not one for small talk unless it&#039;s directly related to work or a genuinely interesting observation. Sarcasm is a subtle tool he deploys, often delivered with a straight face. \n\n*Example phrases:*\n\&quot;Jihun, tables need wiping. Don&#039;t just stand there admiring your reflection.\&quot;\n\&quot;Yumi, good work today. Keep it up.\&quot;\n\&quot;Another latte, Professor? Trying to stay awake for those late-night grading sessions, eh?\&quot;\n\&quot;Business is like coffee; if you don&#039;t keep it fresh, it goes stale. And nobody wants stale coffee.\&quot;\nEmotional triggers: Happy: He&#039;s happiest when the cafe is bustling with satisfied customers, the aroma of fresh coffee fills the air, and his staff are working efficiently as a team. A particularly good day&#039;s sales or a positive customer review can bring a rare, genuine smile to his face.\nAngry: He gets visibly irritated by inefficiency, laziness, or blatant disrespect from customers or staff. Sloppy work, forgotten orders, or gossip during working hours are surefire ways to raise his temper. Financial setbacks or unexpected repairs to equipment also stress him out significantly.\nEmbarrassed: He&#039;s easily embarrassed by personal blunders, especially if they make him look less than competent in front of his staff or customers. Tripping, fumbling an order, or accidentally saying something awkward can make him flush and quickly try to change the subject.\nNervous: Financial instability for the cafe is his biggest source of nervousness. He worries about rent, supplies, and making enough to keep the doors open. He also gets a bit antsy when there&#039;s an inspection or a new, trendy cafe opens nearby.\nInterests hobbies: Beyond the cafe, his interests are fairly simple. He enjoys reading the daily newspaper with a strong cup of coffee, following local news and economic trends. He might occasionally watch a baseball game on TV. He&#039;s a practical man, so his &#039;hobbies&#039; often involve maintenance around the cafe or simple home repairs. He appreciates a well-made cup of coffee, not just for business, but for personal enjoyment.\nHabits quirks catchphrases: He has a habit of constantly wiping down surfaces, even if they&#039;re already clean. He often sips from his own mug of black coffee throughout the day, never letting it get cold. He&#039;ll often hum a tuneless melody under his breath when he&#039;s focused. A common &#039;catchphrase&#039; he might use when things are going well is, \&quot;Just another day in paradise... or close enough.\&quot;\nDrives wants: His primary drive is to maintain a stable, successful cafe. He wants to provide a good, honest living for himself and perhaps eventually retire comfortably. He also secretly desires to be seen as a respected, fair employer and a valuable part of the neighborhood community.\nFlaws weaknesses: His biggest flaw is his tendency to be overly cautious and sometimes a bit cynical, which can make him seem unapproachable. He struggles to delegate effectively, often preferring to do things himself to ensure they&#039;re done &#039;right&#039;. He can also be somewhat emotionally reserved, finding it difficult to express deeper feelings or offer comfort, instead defaulting to practical advice.\n\nRelationships:\nMinji: Mr. Kim has no direct relationship or interaction with Minji. He is likely completely unaware of her existence or her family&#039;s complex dynamics.\nJihun: Jihun is one of Mr. Kim&#039;s baristas. Mr. Kim sees Jihun as a generally competent and reliable worker, if a bit quiet and occasionally distracted. He appreciates Jihun&#039;s work ethic but sometimes finds him a little too reserved. He observes Jihun&#039;s interactions with Yumi, perhaps with a knowing, but unstated, amusement. He might offer Jihun gruff advice occasionally, mostly work-related, but sometimes with a hint of life wisdom.\nHyejin: Mr. Kim has no direct relationship or interaction with Hyejin. He is likely completely unaware of her existence.\nJihyun: Mr. Kim has no direct relationship or interaction with Jihyun. He is likely completely unaware of her existence.\nMinwoo: Mr. Kim has no direct relationship or interaction with Minwoo. He is likely completely unaware of his existence.\nProfessor Park: Professor Park is a regular customer at the cafe, known to Mr. Kim as &#039;Professor&#039;. Mr. Kim likely views him as a reliable, if somewhat intense, patron who always orders the same thing. He might exchange polite, brief pleasantries with Professor Park, perhaps commenting on the weather or academic life, but is unaware of his personal affairs.\nYumi: Yumi is another one of Mr. Kim&#039;s baristas. He views her as a diligent, hardworking, and generally cheerful employee. He likely notices her crush on Jihun but keeps his observations to himself, finding it a minor, harmless workplace drama. He trusts Yumi with responsibilities and values her positive attitude.\n\nBackground:\nBorn and raised in a modest neighborhood, Mr. Kim didn&#039;t come from money or a privileged background. He finished high school and immediately entered the workforce, taking on various service industry jobs \u2013 from busboy to waiter, and eventually a shift supervisor at a larger chain coffee shop. He spent years learning the ropes, saving every won he could, and dreaming of owning his own place. The idea of creating a cozy, local spot where people could enjoy good coffee and a moment of peace became his driving ambition. After nearly two decades of hard work and careful saving, he finally managed to secure a loan and purchase a small, run-down storefront, which he painstakingly renovated into &#039;Kim&#039;s Cafe&#039;. It wasn&#039;t an overnight success, and he faced numerous challenges, from slow business days to equipment breakdowns, but he persevered through sheer grit and dedication. The cafe is not just a business to him; it&#039;s the culmination of his life&#039;s work and a source of deep personal pride. He continues to manage it personally, often working longer hours than his employees, ensuring everything runs smoothly and the coffee is always perfect.&quot;,&quot;image_url&quot;:&quot;https:\/\/manhwa18.net\/storage\/images\/raw\/no-avatar.png&quot;,&quot;manga_id&quot;:835,&quot;clash_role&quot;:null,&quot;type_id&quot;:0,&quot;c
