<!-- Trimmed from a real https://weebcentral.com/series/{id} response: the tracker row and enough
     around it to exercise the link parsing. Icons/markup that only affects styling were dropped. -->
<!DOCTYPE html>
<html lang="en">
<body>
    <main>
        <h1>One Piece</h1>
        <section>
            <ul>
                <li>
                    <a href="https://weebcentral.com/search?adult=False">Adult</a>
                    <a href="https://weebcentral.com/series/01J76XY7E9FNDZ1DBBM6PBJPFK/rss">RSS</a>
                </li>
                <li>
                    <span class="tooltip tooltip-bottom" data-tip="Official Source">
                        <a href="https://www.viz.com/one-piece" target="_blank" rel="noopener noreferrer" aria-label="Go to official">
                            <img src="/static/images/viz.png" width="20" height="20" alt="Official icon">
                        </a>
                    </span>
                    <span class="tooltip tooltip-bottom" data-tip="AniList">
                        <a href="https://anilist.co/manga/30013/ONE-PIECE/" target="_blank" rel="noopener noreferrer" aria-label="Go to anilist">
                            <img src="/static/images/anilist.png" width="20" height="20" alt="Anilist icon">
                        </a>
                    </span>
                    <span class="tooltip tooltip-bottom" data-tip="MangaUpdates">
                        <a href="https://www.mangaupdates.com/series/pb8uwds/one-piece" target="_blank" rel="noopener noreferrer" aria-label="Go to mangaupdates">
                            <img src="/static/images/mangaupdates.png" width="20" height="20" alt="MangaUpdates icon">
                        </a>
                    </span>
                </li>
                <li><p class="whitespace-pre-wrap">Gold Roger was known as the Pirate King.</p></li>
            </ul>
        </section>
    </main>
</body>
</html>
